# --- IPSI de la primera entrega de vivienda ------------------------------------------------------------------
# En Ceuta y Melilla no hay IVA: la entrega de inmuebles tributa por IPSI (operaciones interiores). Se carga con el kind
# iva_vivienda_nueva (la regla de ES lleva el IVA del 10 % y la más específica gana), como hace canarias.yaml con el IGIC.

- id: ceuta-ipsi-vivienda-nueva-2019
