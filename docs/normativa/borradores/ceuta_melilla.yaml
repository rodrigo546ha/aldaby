      - {from: 12450, rate: 0.12}
      - {from: 20200, rate: 0.15}
      - {from: 35200, rate: 0.185}
      - {from: 60000, rate: 0.225}
  source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2006-20764#a65
  notes: "Ley 35/2006, disposición adicional 32.ª (añadida por la Ley 2/2011, modificada por el RDL 9/2015 con efectos 01/01/2015): «La escala autonómica aplicable a los contribuyentes que tengan su residencia habitual en Ceuta o Melilla será la prevista en el artículo 65». Art. 65, redacción de la Ley 26/2014 (en vigor desde 01/01/2015): 9,5 % hasta 12.450 €; 12 % hasta 20.200 €; 15 % hasta 35.200 €; 18,5 % hasta 60.000 €; 22,5 % en adelante. DEDUCCIÓN NO MODELADA: art. 68.4.1.º, el 60 % de la parte de la suma de las cuotas íntegras estatal y autonómica que corresponda a rentas obtenidas en Ceuta o Melilla, con residencia habitual y efectiva allí. No hay mínimos propios (rigen los estatales)."

