# BORRADOR, NO SE CARGA: está fuera de services/api/data/rules a propósito. El motor aún no aplica las
# bonificaciones del 50 % (ITP, AJD, plusvalía) ni la deducción del 60 % del IRPF, y sin ellas los planes
# saldrían muy por encima (ADR-0043). Se mueve a data/rules cuando el motor las modele.
# Ciudades Autónomas de Ceuta (ES-18, municipio ES-18-51001) y Melilla (ES-19, municipio ES-19-52001). Ver README.md.
# SIN VERIFICAR: ninguna pasa a verified: true hasta que Rodrigo lea la fuente.
# Fuentes leídas el 2026-11-03: TRLITPAJD (RDLeg 1/1993, BOE consolidado, última actualización 21/03/2026), Ley 35/2006
# del IRPF (BOE consolidado, última actualización 07/10/2026), TRLRHL (RDLeg 2/2004, art. 159), ordenanza del IPSI de
# Ceuta (texto consolidado de la sede tributaria de la Ciudad, con modificaciones hasta 2024), anexo 1 de la ordenanza
# del IPSI de Melilla (BOME núm. 5857, 04/05/2021), ordenanzas del IIVTNU de ambas ciudades (BOCCE 24/05/2022 y
# BOME núm. 5962, 06/05/2022), BOCCE núm. 6525 (27/06/2025) y las nueve resoluciones trimestrales del Ministerio de
# Vivienda sobre zonas tensionadas.
#
# Ceuta y Melilla NO tienen cedidos ITP, AJD ni tramo autonómico del IRPF como una comunidad de régimen común:
# rige la ley estatal. Ni IVA ni IGIC: la entrega de vivienda nueva tributa por IPSI (impuesto municipal propio).
#
# PENDIENTE (sin fuente oficial leída, no se escribe):
# - BONIFICACIONES QUE EL MOTOR NO MODELA (las reglas llevan el tipo legal, sin bonificar; decide Rodrigo cómo modelarlas):
#   * ITP: bonificación del 50 % de la cuota en transmisiones de inmuebles situados en Ceuta o Melilla
#     (TRLITPAJD, art. 57 bis.3.a, añadido por la Ley 53/2002, en vigor desde 01/01/2003). Tipo efectivo resultante = 3 %.
#   * AJD: bonificación del 50 % de la cuota gradual de documentos notariales cuando el Registro donde se inscribe
#     radique en Ceuta o Melilla (art. 57 bis.1). Tipo efectivo resultante = 0,25 %.
#   * Plusvalía municipal: bonificación del 50 % de la cuota de todos los impuestos municipales (TRLRHL, art. 159.2),
#     recogida expresamente en la ordenanza de Ceuta (art. 9.1). En Melilla la ordenanza no la repite, pero el art. 159.2
#     es de aplicación directa. La misma bonificación afecta al IBI de ibi_hacienda_2026.yaml (ES-18-51001 y ES-19-52001).
#   * IRPF: deducción del 60 % de la cuota íntegra (estatal más autonómica) correspondiente a rentas obtenidas en Ceuta o
#     Melilla (Ley 35/2006, art. 68.4): afecta a un residente en esas ciudades (art. 68.4.1.º) y también a un no residente
#     que arriende allí un inmueble (art. 68.4.2.º y 68.4.3.º.b: los rendimientos de inmuebles situados en Ceuta o Melilla
#     son «rentas obtenidas» allí). No se modela.
# - ¿Está la primera entrega de vivienda nueva (sujeta a IPSI, no a IVA) fuera de TPO y sujeta a AJD? El art. 7.5 y el
#   art. 31.2 del TRLITPAJD hablan de operaciones sujetas a IVA y no mencionan el IPSI (solo la disposición adicional
#   sobre Canarias equipara IVA e IGIC). La regla de AJD se escribe porque el art. 31.2 grava toda primera copia de
#   escritura inscribible no sujeta a TPO; falta comprobar si una entrega sujeta a IPSI tributa por TPO o por AJD.
# - Texto consolidado actual de la ordenanza del IPSI de Ceuta: la copia leída recoge modificaciones hasta 2024 y el
#   art. 33.Tres no cambia; no se ha podido descartar una modificación posterior a 2024 no recogida.
# - Ordenanza del IPSI de Melilla: solo se ha leído el anexo 1 del BOME de 04/05/2021 (el mismo 4 % ya figuraba en la
#   versión del BOME de 12/02/2019); no se ha buscado una modificación posterior a 2021 y no se ha leído la primera
#   página del decreto 584/2021 que lo aprueba.
# - Minimo del contribuyente y por descendientes: Ceuta y Melilla no tienen mínimos propios (no hay competencia
#   normativa autonómica); rigen los de la Ley 35/2006. No se escribe ninguna regla.
# - Alquiler turístico de Melilla: no se ha encontrado ninguna norma propia sobre vivienda de uso turístico ni
#   procedimiento de código de registro en el BOME; solo el Reglamento de Turismo de 2010, que no se ha leído.
# - Alquiler turístico de Ceuta: el Reglamento de Turismo de 2010 (apartamentos turísticos) no menciona la vivienda de
#   uso turístico en el texto leído; solo se carga el decreto 1/2025 del código de registro. Una noticia secundaria
#   indica que el Tribunal Supremo habría anulado el Real Decreto 1312/2024 (registro único) en el que se apoya: sin
#   fuente oficial leída; comprobarlo.
# - Régimen urbanístico municipal del alquiler turístico de Ceuta y Melilla.
# - Plusvalía de Ceuta: la fecha de publicación (BOCCE 24/05/2022) sale de la cabecera de la copia de la sede tributaria;
#   la ordenanza se aprobó el 28/02/2022. En Melilla no se ha comprobado que no haya modificaciones posteriores a 2022
#   (sí hay una orden de 2025 que solo actualiza coeficientes).
# - Zonas tensionadas: no se ha leído la resolución del segundo trimestre de 2024 (julio de 2024); las nueve leídas
#   (marzo y octubre de 2024 y las siguientes) son las citadas en las reglas.

