  territory: ES-18
  effective_from: 2019-01-30
  effective_to: null
  status: vigente
  verified: false
  params: {rate: 0.04}
  source_url: https://www.2006.isotools.org/centros/27/gdocumental/l30_a51_c1/4._ORDENANZA_FISCAL_REGULADORA_IPSI_-_2024_reformado.pdf
  notes: "ESTO ES IPSI, NO IVA. Ordenanza del IPSI de la Ciudad Autónoma de Ceuta, art. 33.Tres: «La construcción y primera transmisión de bienes inmuebles, así como la ejecución de obra inmobiliaria, tributarán con carácter general al tipo del 4 %», con las excepciones de la transmisión de viviendas de protección oficial de régimen especial o de promoción pública (2 %) y de las obras públicas con el sector público (10 %); ninguna aplica a un inversor. Texto consolidado publicado en la sede tributaria de la Ciudad (tributosceuta.org), con modificaciones hasta 2024; el art. 33.Tres no cambia desde el texto refundido del BOCCE de 30/01/2019 (fecha de inicio tomada de esa publicación; la entrada en vigor y el origen del 4 % por verificar)."

