# --- IRPF, escala autonómica (ADR-0007) ---------------------------------------------------------------------
# En Ceuta y Melilla no hay escala autonómica propia: la disposición adicional 32.ª de la Ley 35/2006 fija para los
# residentes habituales la escala del art. 65 (la «complementaria»). La deducción del art. 68.4 (60 %) no se modela.
# Misma escala en ambas ciudades; sin cambios desde el 01/01/2015 (Ley 26/2014).
- id: ceuta-irpf-escala-general-2015
