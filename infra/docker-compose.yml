# Base de datos local. El esquema lo aplica `make db` con el ejecutor de migraciones (ADR-0008).
name: housefinder
services:
  db:
    image: postgis/postgis:16-3.4
    # Vuelve a arrancar con Docker (el worker la necesita siempre, ver infra/launchd/).
    restart: unless-stopped
    environment:
      POSTGRES_USER: housefinder
      POSTGRES_PASSWORD: housefinder
      POSTGRES_DB: housefinder
    ports:
      - "127.0.0.1:${HOUSEFINDER_DB_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "housefinder", "-d", "housefinder"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 1s
      start_interval: 1s
volumes:
  pgdata:
