# Trabajos periódicos de la cola (ADR-0010). `make schedules` aplica este fichero a la tabla
# job_schedules: crea o cambia cada programación y desactiva las que ya no están aquí.
#
# - at: primera hora, en hora de Madrid. Después se repite cada `every_hours`. El intervalo es
#   fijo: con el cambio de hora la ejecución se mueve una hora hasta volver a aplicar el fichero.
# - requires_env: no se programa si falta alguna de estas variables (se avisa).
# - El BOE publica sobre las 7:30; a las 9:00 el sumario ya está. Los trabajos leen los días que
#   faltan (`days`), así que un día sin worker se recupera al siguiente.
timezone: Europe/Madrid
schedules:
  - name: oferta-boe-seccion-v
    kind: offers_boe_v
    at: "09:00"
    every_hours: 24
    payload: {days: 7}

  - name: oferta-boe-subastas-judiciales
    kind: offers_boe_auctions
    at: "09:15"
    every_hours: 24
    payload: {days: 7}

  # Subastas de inmuebles del Portal de Subastas del BOE como lotes (ADR-0049, ADR-0053)
  - name: oferta-boe-portal-subastas
    kind: offers_boe_portal
    at: "09:25"
    every_hours: 24
    payload: {province: "28"}

  - name: oferta-extraccion-boe
    kind: extract_offers
    at: "10:00"
    every_hours: 24
    payload: {limit: 20}
    requires_env: [LLM_PROVIDER, LLM_BASE_URL, LLM_MODEL_ID]

  # Ventas directas del Patrimonio del Estado (ADR-0037): las subastas entran por el BOE.
  - name: oferta-patrimonio-ventas-directas
    kind: offers_patrimonio
    at: "09:20"
    every_hours: 24
    payload: {}

  - name: oferta-extraccion-patrimonio
    kind: extract_offers
    at: "10:30"
    every_hours: 24
    payload: {limit: 10, channel: patrimonio_estado}
    requires_env: [LLM_PROVIDER, LLM_BASE_URL, LLM_MODEL_ID]

  # Feeds de agencias con su consentimiento (ADR-0038). Los CRM los generan de madrugada.
  - name: oferta-feeds-de-agencias
    kind: offers_agency_feeds
    at: "07:00"
    every_hours: 24
    payload: {}

  - name: vigilancia-boe
    kind: watch_boe
    at: "09:30"
    every_hours: 24
    payload: {days: 7}

  - name: vigilancia-bocm
    kind: watch_bocm
    at: "09:45"
    every_hours: 24
    payload: {}

  # Referencias de precio (ADR-0018): el INE publica el IPV cada trimestre. Mirar cada 30 días es
  # barato; cada comunidad sustituye solo su serie (ADR-0043). El valor tasado no se programa: su portal
  # (datos.comunidad.madrid) prohíbe el acceso automático y el CSV se descarga a mano.
  - name: referencias-ipv
    kind: ine_ipv
    at: "11:00"
    every_hours: 720
    payload: {region: todas}

  # Componente de alquiler del IPC (ADR-0018): el INE lo publica cada mes, hacia mediados.
  - name: referencias-ipc-alquiler
    kind: ine_ipc_alquiler
    at: "11:30"
    every_hours: 168
    payload: {region: todas}
