# Niveles de acceso (F8.2, ADR-0041). Los profesionales de la beta no tienen límite de planes. El
# pase de compra (F8.3) levantará el del nivel gratuito.
gratuito:
  planes_completos: 3   # ofertas distintas con plan completo (página, PDF y explicación)
  # ADR-0065, confirmado por Rodrigo el 2026-11-06; revisar con el uso real de la beta.
  consultas_asesor_dia: 20   # preguntas y explicaciones del asesor al día (día natural de Madrid)
profesional:
  # ADR-0065, confirmado el 2026-11-06: protege el servidor del modelo; lo comparten los
  # usuarios de la organización.
  consultas_asesor_dia: 200
