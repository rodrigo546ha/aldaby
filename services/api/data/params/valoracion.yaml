# Parámetros del modelo de renta y precio (ADR-0018). Ver data/params/README.md.
# Calibrado con el backtesting de F5.6 (docs/research/f5-6-backtesting.md): con los datos del
# SERPAVI de la Comunidad de Madrid 2011–2024, contraer la sección hacia el municipio empeora la
# estimación en todos los horizontes (1, 2 y 3 años) y en todos los tamaños de sección. k = 0: sin
# contracción. El mecanismo se mantiene por si una calibración posterior cambia el resultado.
- id: contraccion-renta-backtesting-2026-10
  kind: contraccion_renta
  territory: ES
  effective_from: 2026-10-30
  effective_to: null
  provisional: false
  params:
    k: 0           # alquileres equivalentes de la zona que contiene la sección
  source: >-
    Backtesting F5.6 del 2026-10-30 con el SERPAVI 2011–2024 de la provincia de Madrid:
    mediana del error al año siguiente, descontada la variación municipal, 2,08 % con k = 0 y
    2,52 % con k = 10 (docs/research/f5-6-backtesting.md)
  source_url: null
  notes: "Sustituye al supuesto inicial k = 10, que no llegó a usarse en ningún plan guardado"

# Convergencia municipal para los escenarios de revalorización (F5.5, ADR-0018). b mide cuánto se
# cierra (b < 0) o se abre (b > 0) cada 3 años la brecha logarítmica entre la renta de un municipio
# y la de la provincia. Ajuste sin constante con el SERPAVI de la provincia de Madrid, por año de
# partida 2011–2021 (11 periodos, `make backtest`): de +0,065 (2011) a −0,0767 (2019). Global
# −0,0002. Percentiles 25 y 75 de los 11 periodos: −0,0313 y +0,0442. El signo cambia con el
# ciclo: el escenario base usa el global y los extremos, el b que favorece o perjudica al municipio.
- id: convergencia-municipal-2026-10
  kind: convergencia_municipal
  territory: ES-13
  effective_from: 2026-10-31
  effective_to: null
  provisional: false
  params:
    step_years: 3
    b_base: -0.0002
    b_low: -0.0313
    b_high: 0.0442
  source: >-
    Ajuste del 2026-10-31 con el SERPAVI 2011–2024 de la provincia de Madrid (make backtest;
    docs/research/f5-5-factores-revalorizacion.md)
  source_url: null
  notes: "Recalcular cuando se cargue un año nuevo del SERPAVI"

# Convergencia municipal del resto de comunidades con el SERPAVI desde 2011 (2026-11-05), con el
# mismo ajuste que Madrid y cada municipio frente a su provincia. b_base = 0: el b global de los años
# anteriores no predice mejor que cero fuera de muestra en 15 de 16 comunidades; los extremos son el
# P25 y el P75 de los b por año, ampliados hasta 0 para que el escenario base quede entre los dos.
# Sin parámetro (País Vasco y Navarra, sin historia en el SERPAVI; Ceuta y Melilla, un solo
# municipio), los escenarios son los del ciclo de la comunidad.

- id: convergencia-municipal-es-01-2026-11
  kind: convergencia_municipal
  territory: ES-01
  effective_from: 2026-11-05
  effective_to: null
  provisional: false
  params:
    step_years: 3
    b_base: 0
    b_low: -0.0288
    b_high: 0.0134
  source: >-
    Ajuste del 2026-11-05 con el SERPAVI 2011–2024 de Andalucía (332 municipios,
    2711 casos, 11 periodos; make backtest CONVERGENCIA=1;
    docs/research/f5-5-convergencia-por-comunidad.md)
  source_url: null
  notes: "b global -0.0049; P25 -0.0288 y P75 0.0134, ampliados hasta 0. Recalcular con cada año nuevo del SERPAVI"

