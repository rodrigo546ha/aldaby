# Comunidades autónomas (y territorios históricos del País Vasco) por código INE y nombres con los que el usuario dice dónde vive
# (ADR-0020). La comunidad se saca de sus palabras, sin modelo: el nombre de la comunidad, una de
# sus provincias o un nombre habitual. Un municipio que no esté aquí («vivo en Getafe») no se
# adivina: se vuelve a preguntar la comunidad.
# Fuente de los códigos: INE, «Relación de comunidades y ciudades autónomas con sus códigos»,
# https://www.ine.es/daco/daco42/codmun/cod_ccaa.htm
