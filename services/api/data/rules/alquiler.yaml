# --- Uso turístico --------------------------------------------------------------------------------

# Estatal. Modelado desde el 01/07/2025 (Registro Único); la aprobación previa de la comunidad
# rige desde el 03/04/2025 (LO 1/2025).
- id: alquiler-turistico-estatal
  kind: regimen_alquiler_turistico
  territory: ES
  effective_from: 2025-07-01
  effective_to: null
  status: vigente
  verified: false
  params:
    regime: "Vivienda de uso turístico (LAU, art. 5.e), sujeta a la normativa turística autonómica"
    requirements:
      - code: aprobacion-previa-comunidad
        description: "Aprobación expresa y previa de la comunidad de propietarios: 3/5 de los propietarios que representen 3/5 de las cuotas (LPH, arts. 7.3 y 17.12)"
        source_url: https://www.boe.es/buscar/act.php?id=BOE-A-1960-10906
      - code: registro-unico-arrendamientos
        description: "Número del Registro Único de Arrendamientos antes de anunciarla en plataformas en línea"
        source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2024-26931
  source_url: https://www.boe.es/buscar/act.php?id=BOE-A-1960-10906

# Comunidad de Madrid (Decreto 79/2014, modificado por el Decreto 27/2026). Requisitos tal como los
# publica la sede electrónica (consultada el 2026-10-28, actualizada el 08/10/2026).
- id: madrid-alquiler-turistico
  kind: regimen_alquiler_turistico
  territory: ES-13
  effective_from: 2026-10-08
  effective_to: null
  status: vigente
  verified: false
  params:
    regime: "Vivienda de uso turístico en la Comunidad de Madrid: actividad profesional del titular, sin residencia permanente de los usuarios"
    requirements:
      - code: declaracion-responsable
        description: "Declaración responsable del titular de la actividad ante la Dirección General de Turismo, por medios electrónicos"
        source_url: https://sede.comunidad.madrid/comunicaciones-declaraciones/vivienda-uso-turistico
      - code: civut
        description: "Certificado de idoneidad para vivienda de uso turístico (CIVUT) suscrito por técnico competente"
        source_url: https://sede.comunidad.madrid/comunicaciones-declaraciones/vivienda-uso-turistico
      - code: certificado-comunidad
        description: "Certificado de que la comunidad no ha prohibido la actividad y aprobación de la comunidad"
        source_url: https://sede.comunidad.madrid/comunicaciones-declaraciones/vivienda-uso-turistico
      - code: seguro-responsabilidad-civil
        description: "Seguro de responsabilidad civil en vigor durante la actividad"
        source_url: https://sede.comunidad.madrid/comunicaciones-declaraciones/vivienda-uso-turistico
      - code: vivienda-completa
        description: "Se cede la vivienda completa (no por habitaciones), amueblada y equipada"
        source_url: https://sede.comunidad.madrid/comunicaciones-declaraciones/vivienda-uso-turistico
      - code: capacidad-maxima
        description: "Capacidad máxima según superficie útil (hasta 2 personas con menos de 25 m², hasta 4 entre 25 y 40 m², 2 más por cada 10 m² y pieza adicional)"
        source_url: https://sede.comunidad.madrid/comunicaciones-declaraciones/vivienda-uso-turistico
  source_url: https://sede.comunidad.madrid/comunicaciones-declaraciones/vivienda-uso-turistico
  notes: "Fecha de inicio = fecha de la sede consultada; la entrada en vigor del Decreto 27/2026 (BOCM 06/04/2026) está por verificar."

