# --- Temporada ------------------------------------------------------------------------------------

# Antes del RDL 29/2026: uso distinto del de vivienda. Modelado desde el 01/07/2025, cuando entra en
# efecto el Registro Único de Arrendamientos; el periodo anterior no se modela.
- id: alquiler-temporada-lau
  kind: regimen_alquiler_temporada
  territory: ES
  effective_from: 2025-07-01
  effective_to: null
  status: vigente
  verified: false
  params:
    regime: "Uso distinto del de vivienda (LAU, art. 3.2): arrendamiento por temporada, sin el régimen de vivienda"
    requirements:
      - code: registro-unico-arrendamientos
        description: "Número del Registro Único de Arrendamientos antes de anunciarlo en plataformas en línea (alquiler de corta duración, turístico o no)"
        source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2024-26931
  source_url: https://www.boe.es/buscar/act.php?id=BOE-A-1994-26003#a3
  notes: "Art. 3.2 anterior al RDL 29/2026: «los arrendamientos de fincas urbanas celebrados por temporada, sea ésta de verano o cualquier otra»."

- id: alquiler-temporada-rdl-29-2026
  kind: regimen_alquiler_temporada
  territory: ES
  effective_from: 2026-10-08
  effective_to: null
  status: pendiente_convalidacion
  verified: false
  params:
    regime: "Vivienda temporal (LAU, arts. 2.3 y 9 bis, redacción del RDL 29/2026); el uso distinto del de vivienda excluye el alojamiento u hospedaje"
    requirements:
      - code: causa-justificada-desplazamiento
        description: "El arrendatario está temporalmente desplazado de su domicilio habitual por causa justificada y acreditable"
        source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2026-20823#a3
      - code: duracion-31-dias-a-12-meses
        description: "Duración superior a 31 días y, como regla general, no mayor de 12 meses"
        source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2026-20823#a3
      - code: conversion-en-vivienda-habitual
        description: "Más de 12 meses sin causa o más de dos contratos temporales seguidos entre las mismas partes: pasa a vivienda habitual, con plazo mínimo y prórrogas"
        source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2026-20823#a3
      - code: registro-unico-arrendamientos
        description: "Número del Registro Único de Arrendamientos para anunciarlo en plataformas (por confirmar: el RD 1312/2024 se remite al art. 3.2 de la LAU, que el RDL cambia)"
        source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2024-26931
  source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2026-20823#a3

