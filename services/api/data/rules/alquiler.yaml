# Regulación del alquiler (F2.4). Ver README.md y docs/normativa/verificacion-tanda-3.md.
# SIN VERIFICAR: ninguna pasa a verified: true hasta que Rodrigo lea la fuente.
#
# Régimen por tipo de alquiler: los requisitos de los niveles estatal (ES), autonómico (ES-13)
# y municipal (ES-13-28079) se SUMAN (resolvers.rental_regime). El RDL 29/2026 va como
# pendiente_convalidacion: el plan base usa la LAU anterior y el RDL entra en escenarios.

# --- Zonas de mercado residencial tensionado ---------------------------------------------------

# Ningún municipio de la Comunidad de Madrid aparece en las diez resoluciones trimestrales del
# Ministerio publicadas hasta la del segundo trimestre de 2026 (en todas, «Madrid» solo aparece en
# la firma). Revisadas: BOE-A-2024-5214, BOE-A-2024-20576, BOE-A-2025-1721, BOE-A-2025-8636,
# BOE-A-2025-15728 (y su corrección BOE-A-2025-20246), BOE-A-2025-21901, BOE-A-2026-2448,
# BOE-A-2026-9175 y BOE-A-2026-16532. Revisar con cada resolución nueva y actualizar checked_through.
- id: madrid-zonas-tensionadas
  kind: zona_tensionada
  territory: ES-13
  effective_from: 2023-05-26
  effective_to: null
  status: vigente
  verified: false
  params: {declared: false, checked_through: 2026-07-29}
  source_url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-16532
  notes: "Ley 12/2023, art. 18: la declaración corresponde a la comunidad autónoma; el Ministerio publica la relación cada trimestre."

