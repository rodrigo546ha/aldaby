# Ninguna zona tensionada en Andalucía: «Andalucía» no figura en ninguna de las nueve resoluciones
# trimestrales del Ministerio leídas, desde la del primer trimestre de 2024 hasta la del segundo de 2026:
# BOE-A-2024-5214, BOE-A-2024-20576, BOE-A-2025-1721, BOE-A-2025-8636, BOE-A-2025-15728,
# BOE-A-2025-21901, BOE-A-2026-2448, BOE-A-2026-9175 y BOE-A-2026-16532. No se ha leído la del
# segundo trimestre de 2024. Revisar con cada resolución nueva y actualizar checked_through.
- id: andalucia-zonas-tensionadas
  kind: zona_tensionada
  territory: ES-01
  effective_from: 2023-05-26
  effective_to: null
  status: vigente
  verified: false
  params: {declared: false, checked_through: 2026-07-29}
  source_url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-16532
  notes: "Ley 12/2023, art. 18: la declaración corresponde a la comunidad autónoma; el Ministerio publica la relación cada trimestre."

# Vivienda de uso turístico en Andalucía: Decreto 28/2016, modificado por el Decreto 31/2024
# (BOJA núm. 24, 02/02/2024; entra en vigor a los veinte días de su publicación: 22/02/2024).
- id: andalucia-alquiler-turistico
  kind: regimen_alquiler_turistico
  territory: ES-01
  effective_from: 2024-02-22
  effective_to: null
  status: vigente
  verified: false
  params:
    regime: "Vivienda de uso turístico en Andalucía (Decreto 28/2016): declaración responsable e inscripción en el Registro de Turismo de Andalucía antes de iniciar la actividad"
    requirements:
      - code: declaracion-responsable
        description: "Declaración responsable electrónica ante la Consejería de Turismo para iniciar la actividad; da lugar a la inscripción en el Registro de Turismo de Andalucía (art. 9.1)"
        source_url: https://www.juntadeandalucia.es/boja/2024/24/50
      - code: compatibilidad-urbanistica
        description: "Cumplir la ordenación urbanística municipal y manifestar la compatibilidad con el planeamiento en la declaración (arts. 6.1.a y 9.1.e); los ayuntamientos pueden limitar con criterios objetivos el número de viviendas por edificio, sector o zona (art. 2.2)"
        source_url: https://www.juntadeandalucia.es/boja/2024/24/50
      - code: estatutos-no-prohiben
        description: "El título constitutivo o los estatutos de la comunidad no pueden prohibir la actividad (art. 1.3.b)"
        source_url: https://www.juntadeandalucia.es/boja/2024/24/50
      - code: no-proteccion-publica
        description: "No puede ser vivienda de protección pública ni estar en situación de asimilado a fuera de ordenación, salvo autorización municipal previa (art. 1.3)"
        source_url: https://www.juntadeandalucia.es/boja/2024/24/50
      - code: una-vivienda-por-referencia-catastral
        description: "Una sola vivienda por referencia catastral, salvo excepciones acreditadas (art. 9.1)"
        source_url: https://www.juntadeandalucia.es/boja/2024/24/50
      - code: titulo-de-todos-los-propietarios
        description: "Si quien explota no es el propietario, debe tener el título jurídico de todos los propietarios cuando el inmueble está en copropiedad (art. 3.2)"
        source_url: https://www.juntadeandalucia.es/boja/2024/24/50
  source_url: https://www.juntadeandalucia.es/boja/2024/24/50
  notes: "Redacción del Decreto 28/2016 según el Decreto 31/2024 (BOJA núm. 24, 02/02/2024). Fecha de inicio calculada: veinte días tras la publicación. Pendiente comprobar posibles modificaciones posteriores a 2024 en el texto consolidado del Decreto 28/2016."

