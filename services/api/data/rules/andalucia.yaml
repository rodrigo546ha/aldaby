# PENDIENTE (sin fuente oficial leída, no se escribe):
# - Régimen urbanístico municipal del alquiler turístico de Sevilla y Málaga (limitaciones por zona).
# - Cualquier modificación autonómica posterior al 31/12/2025 de la Ley 5/2021 que el BOE aún no consolide.

# ITP de inmuebles, tipo general (único, para todo el valor). Los tipos reducidos de los arts. 43 y 44
# (política social de vivienda, reventa por profesionales) no aplican a un inversor particular.
# La Ley 5/2021 entró en vigor el 01/01/2022, salvo los arts. 41, 43, 49 y 50, que lo hicieron el día
# siguiente a su publicación en el BOJA (BOJA núm. 206, 26/10/2021): 27/10/2021.
- id: andalucia-itp-inmuebles-2021
  kind: impuesto_compra_segunda_mano
  territory: ES-01
  effective_from: 2021-10-27
  effective_to: null
  status: vigente
  verified: false
  params: {rate: 0.07}
  source_url: https://www.boe.es/eli/es-an/l/2021/10/20/5/con
  notes: "Ley 5/2021, de 20 de octubre, de Tributos Cedidos de la Comunidad Autónoma de Andalucía (BOE-A-2021-17915), art. 41: en las transmisiones de bienes inmuebles y en la constitución y cesión de derechos reales (salvo de garantía), tipo del 7 % sobre la base liquidada, único para todo el valor (no por tramos)."

# AJD de la escritura de compra de vivienda sujeta a IVA: tipo general de los documentos notariales,
