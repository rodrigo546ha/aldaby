- id: andalucia-ajd-compra-vivienda-2021
  kind: ajd_compra_vivienda
  territory: ES-01
  effective_from: 2021-10-27
  effective_to: null
  status: vigente
  verified: false
  params:
    bands:
      - {up_to: null, rate: 0.012}
    cap_jumps: false
  source_url: https://www.boe.es/eli/es-an/l/2021/10/20/5/con
  notes: "Ley 5/2021 de Andalucía, art. 49: primeras copias de escrituras inscribibles con cantidad o cosa valuable, no sujetas a Sucesiones y Donaciones ni a TPO/IVA del art. 1.1 y 1.2 del TRLITPAJD, tributan además de la cuota fija al 1,2 %. No incluye los reducidos del art. 50 (política social de vivienda). Persona jurídica: mismo tipo (no hay tipo propio)."

# --- IRPF, tramo autonómico (ADR-0007) -------------------------------------------------------
# Deflactación del Decreto-ley 7/2022, de 20 de septiembre (BOJA núm. 182, 21/09/2022; convalidado el
# 28/09/2022). Los apartados uno y dos de su art. primero (escala y mínimos) surten efectos desde el
# 01/01/2022. La escala original de 2021 (primer tramo hasta 12.450 €) queda sustituida desde esa fecha.
# El texto consolidado a 31/12/2025 mantiene esta escala, por lo que rige también en 2025 y 2026.
- id: andalucia-irpf-escala-general-2022
  kind: escala_irpf_general_autonomica
  territory: ES-01
  effective_from: 2022-01-01
  effective_to: null
  status: vigente
  verified: false
  params:
    brackets:
      - {from: 0, rate: 0.095}
      - {from: 13000, rate: 0.12}
      - {from: 21100, rate: 0.15}
      - {from: 35200, rate: 0.185}
      - {from: 60000, rate: 0.225}
  source_url: https://www.boe.es/eli/es-an/l/2021/10/20/5/con
  notes: "Ley 5/2021 de Andalucía, art. 23 (redacción del Decreto-ley 7/2022, efectos 01/01/2022): 9,5 % hasta 13.000 €; 12 % hasta 21.100 €; 15 % hasta 35.200 €; 18,5 % hasta 60.000 €; 22,5 % en adelante. Fuente del decreto-ley: https://www.juntadeandalucia.es/boja/2022/182/1"

