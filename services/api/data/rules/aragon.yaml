# Comunidad Autónoma de Aragón (ES-02) y municipios de Zaragoza (ES-02-50297) y Huesca (ES-02-22125).
# Ver README.md. SIN VERIFICAR: ninguna pasa a verified: true hasta que Rodrigo lea la fuente.
# Decreto Legislativo 1/2005 leído el 2026-11-03 en el texto consolidado del BOE (BOA-d-2005-90006,
# «Última actualización publicada el 07/07/2025», Ley 3/2025, que no toca los artículos usados aquí).
#
# PENDIENTE (sin fuente oficial leída, no se escribe):
# - Mínimos del contribuyente y por descendientes: Aragón no tiene propios en el DL 1/2005 (el título I,
#   capítulo I solo fija la escala, art. 110-1, y deducciones). Se heredan los estatales (no hay regla).
# - Cualquier ley aragonesa posterior al 07/07/2025 que modifique el DL 1/2005 y el BOE aún no consolide.
#   La página de normativa de la Administración Tributaria de Aragón no lista ninguna de medidas fiscales
#   ni presupuestos para 2025 o 2026.
# - Tipo de la plusvalía de Huesca antes de 2026 (la ordenanza está derogada y su texto ya no se publica).
# - Régimen urbanístico municipal del alquiler turístico de Zaragoza y Huesca.

# ITP de inmuebles, tipo general. Los tipos reducidos (arts. 121-3 y siguientes: empresarios con IVA exento,
# VPO, etc.) no aplican a un inversor particular.
# Escala PROGRESIVA: la tabla del art. 121-1 da la cuota íntegra acumulada de cada tramo y el tipo sobre el
# «resto valor bien» (cuota íntegra de 32.000 € a 400.000 € = 8 % x 400.000, etc.); no se aplica el tipo
# del tramo a todo el valor, así que no lleva whole_value.
- id: aragon-itp-inmuebles-2016
  kind: impuesto_compra_segunda_mano
  territory: ES-02
  effective_from: 2016-01-01
  effective_to: null
  status: vigente
  verified: false
  params:
    brackets:
      - {from: 0, rate: 0.08}
      - {from: 400000, rate: 0.085}
      - {from: 450000, rate: 0.09}
      - {from: 500000, rate: 0.095}
      - {from: 750000, rate: 0.10}
  source_url: https://www.boe.es/buscar/act.php?id=BOA-d-2005-90006#a1-4
  notes: "Decreto Legislativo 1/2005 de Aragón, art. 121-1, redacción del art. 2.1 de la Ley 10/2015, de 28 de diciembre (efectos desde el 01/01/2016, disp. final 2.2). Escala: 8 % hasta 400.000 €; 8,5 % de 400.000 a 450.000; 9 % de 450.000 a 500.000; 9,5 % de 500.000 a 750.000; 10 % desde 750.000. Cuota íntegra acumulada de la tabla: 32.000, 36.250 y 40.750 y 64.500 € en 400.000, 450.000, 500.000 y 750.000 € (coincide con progresiva). «Determinados así los tipos procedentes, se aplicarán sobre la base liquidable en la misma proporción que sobre el valor del bien»."

# AJD de la escritura de compra de vivienda sujeta a IVA: tipo general de los documentos notariales,
