# --- Alquiler ---------------------------------------------------------------------------------

# Ninguna zona tensionada en Aragón: ni «Aragón» ni Zaragoza, Huesca o Teruel figuran en ninguna de las nueve
# resoluciones trimestrales del Ministerio leídas, de la del primer trimestre de 2024 a la del segundo de
# 2026: BOE-A-2024-5214, BOE-A-2024-20576, BOE-A-2025-1721, BOE-A-2025-8636, BOE-A-2025-15728,
# BOE-A-2025-21901, BOE-A-2026-2448, BOE-A-2026-9175 y BOE-A-2026-16532. No se ha leído la del segundo
# trimestre de 2024. Revisar con cada resolución nueva y actualizar checked_through.
- id: aragon-zonas-tensionadas
  kind: zona_tensionada
  territory: ES-02
  effective_from: 2023-05-26
  effective_to: null
  status: vigente
  verified: false
  params: {declared: false, checked_through: 2026-07-29}
  source_url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-16532
  notes: "Ley 12/2023, art. 18: la declaración corresponde a la comunidad autónoma; el Ministerio publica la relación cada trimestre. La del segundo trimestre de 2026 (Resolución de 24/07/2026, BOE núm. 184 de 29/07/2026) solo recoge Asturias, Galicia y País Vasco."

# Vivienda de uso turístico en Aragón: Decreto 1/2023, de 11 de enero, Reglamento de las viviendas de uso
# turístico, más la exigencia del acuerdo de la comunidad desde el 03/04/2025 (Ley Orgánica 1/2025,
# disp. final 4.ª, que modifica los arts. 7 y 17 de la LPH). Requisitos tal como los publica el trámite
# 1763 de la sede del Gobierno de Aragón (consultado el 2026-11-03).
- id: aragon-alquiler-turistico
  kind: regimen_alquiler_turistico
  territory: ES-02
  effective_from: 2025-04-03
  effective_to: null
  status: vigente
  verified: false
  params:
    regime: "Vivienda de uso turístico en Aragón (Decreto 1/2023): declaración responsable previa e inscripción informativa en el Registro de Turismo de Aragón"
    requirements:
      - code: declaracion-responsable
        description: "Declaración responsable previa al inicio de la actividad ante la Dirección General de Turismo y Hostelería, por vía electrónica o presencial; se puede ejercer desde que se presenta y se revisa en un máximo de 3 meses"
        source_url: https://www.aragon.es/tramitador/-/tramite/declaracion-responsable-viviendas-turistico
      - code: tipo-de-inmueble
        description: "Solo inmuebles sometidos a propiedad horizontal, viviendas unifamiliares aisladas o de complejos inmobiliarios privados, amueblados y equipados para uso inmediato"
        source_url: https://www.aragon.es/tramitador/-/tramite/declaracion-responsable-viviendas-turistico
      - code: acuerdo-comunidad-propietarios
        description: "En propiedad horizontal, acuerdo expreso de la junta aprobando el uso turístico, con el voto favorable de 3/5 de los propietarios y 3/5 de las cuotas (arts. 7.3 y 17.12 de la LPH); no se exige a quien ya ejercía antes del 03/04/2025 acogido a la normativa turística"
        source_url: https://aragon.es/documents/d/guest/cambios-en-la-regulacion-de-viviendas-de-uso-turistico-abril-2025-pdf
      - code: titulo-disponibilidad
        description: "Documento que acredite el título de disponibilidad del inmueble para uso turístico"
        source_url: https://www.aragon.es/tramitador/-/tramite/declaracion-responsable-viviendas-turistico
      - code: tasa-50
        description: "Pago de la tasa 50, tarifa 2 (130,00 €) y aportar el justificante"
        source_url: https://www.aragon.es/tramitador/-/tramite/declaracion-responsable-viviendas-turistico
  source_url: https://www.aragon.es/tramitador/-/tramite/declaracion-responsable-viviendas-turistico
  notes: "Fecha de inicio = entrada en vigor de la modificación de la LPH (03/04/2025); la entrada en vigor del Decreto 1/2023 y su texto en el BOA no se han leído (por verificar). Se presume sujeta al reglamento la cesión por un mes o menos por usuario o comercializada en canales turísticos. El art. 15.2.f del decreto (declaración de que los estatutos no la prohíben) queda desplazado por el acuerdo expreso, según la Administración."

# --- Plusvalía municipal (tipo único) ----------------------------------------------------------

# Zaragoza: Ordenanza Fiscal nº 9, art. 13: 28 % único. Texto publicado en el BOPZ nº 29 de 06/02/2026
# (aprobación definitiva del Pleno de 28/01/2026; entra en vigor al publicarse).
- id: zaragoza-plusvalia-tipo
  kind: tipo_plusvalia
  territory: ES-02-50297
  effective_from: 2026-02-06
  effective_to: null
  status: vigente
  verified: false
  params: {rate: 0.28}
  source_url: https://www.zaragoza.es/sede/servicio/normativa/3465
  notes: "Ordenanza Fiscal nº 9 del Ayuntamiento de Zaragoza, art. 13: «el tipo de gravamen único del 28%». Fecha de inicio = BOPZ nº 29 (06/02/2026); el 28 % puede venir de antes (según fuentes secundarias, rebaja del 30 % a 28 % por propuesta de Vox en las ordenanzas anteriores; no leído en el BOPZ). La sede muestra además una modificación del art. 14.2 aprobada inicialmente el 29/09/2026 (BOPZ 02/10/2026), que no toca el tipo."

