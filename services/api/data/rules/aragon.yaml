# exención del IVA (art. 122-2) ni las bonificaciones del art. 122-3 y 122-10 (familias numerosas, colectivos).
- id: aragon-ajd-compra-vivienda-2016
  kind: ajd_compra_vivienda
  territory: ES-02
  effective_from: 2016-01-01
  effective_to: null
  status: vigente
  verified: false
  params:
    bands:
      - {up_to: null, rate: 0.015}
    cap_jumps: false
  source_url: https://www.boe.es/buscar/act.php?id=BOA-d-2005-90006#a1-10
  notes: "Decreto Legislativo 1/2005 de Aragón, art. 122-1.1, redacción del art. 2.8 de la Ley 10/2015, de 28 de diciembre (efectos desde el 01/01/2016): «tipo general del 1,5 por 100 en las primeras copias de escrituras y actas notariales sujetas como Documentos notariales». Persona jurídica: mismo tipo (no hay tipo propio)."

