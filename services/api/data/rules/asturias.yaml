# Principado de Asturias (ES-03) y municipio de Oviedo (ES-03-33044). Zonas tensionadas en los municipios
# de Avilés, Cabrales, Gijón, Gozón y Llanes. Ver README.md.
# SIN VERIFICAR: ninguna pasa a verified: true hasta que Rodrigo lea la fuente.
# Texto consolidado del Decreto Legislativo 2/2014 leído el 2026-11-03 (BOE-A-2015-945, «Última
# actualización publicada el 31/12/2025»), con la Ley 3/2025 (BOE-A-2025-25707) y la Ley 11/2014
# (BOE-A-2015-1764, art. 39) que lo modifican.
#
# PENDIENTE (sin fuente oficial leída, o que el esquema no admite; no se escribe):
# - Plusvalía de Gijón: la Ordenanza Fiscal nº 1.03 (ordenanzas 2026 de Gijón) fija el tipo según el periodo
#   de generación (25 % hasta 5 años, 22 % de 6 a 19 años, 18 % con 20 o más) y `tipo_plusvalia` solo admite
#   un tipo único. Fuente leída: https://drupal.gijon.es/sites/default/files/2026-02/ORDENANZAS%202026_1.pdf
#   (art. 8.1). No se ha leído el BOPA con la fecha de entrada en vigor.
# - Resolución trimestral del Ministerio de Vivienda del tercer trimestre de 2026 (la de octubre): no se ha
#   localizado; pueden existir nuevas declaraciones asturianas (p. ej. Oviedo, que hoy no figura).
# - Delimitación exacta de las zonas tensionadas (barrios y núcleos): las reglas municipales marcan el
#   municipio entero como declarado, pero la declaración es solo de los ámbitos citados en cada nota.
# - Régimen anterior (Decreto 48/2016 antes del Decreto 4/2026) de la vivienda de uso turístico: no leído.
# - Régimen urbanístico municipal del alquiler turístico (ordenanzas de Oviedo y Gijón, art. 2.3 del decreto).
# - Modificaciones autonómicas posteriores al 31/12/2025 que el BOE aún no consolide.

# ITP de inmuebles, tipo general. Los tipos reducidos de los arts. 27 a 32 bis (VPP, empresas, vivienda
# habitual de jóvenes de hasta 35 años, familias numerosas y monoparentales, zonas rurales, etc.) no aplican a
# un inversor particular. El art. 31 bis (en vigor desde el 03/12/2025) fija el 20 % solo si el adquirente es
# gran tenedor (más de diez inmuebles urbanos residenciales o más de 1.500 m², o más de cinco en zona tensionada
# declarada) o si se compra un edificio entero de viviendas para uso turístico: no se modela.
# Tarifa por TRAMOS aplicada a TODO el valor (`whole_value: true`): el tipo del tramo en que cae el valor
# íntegro del bien se aplica a la totalidad del precio, no solo al exceso.
- id: asturias-itp-inmuebles-2014
  kind: impuesto_compra_segunda_mano
  territory: ES-03
  effective_from: 2014-10-30
  effective_to: null
  status: vigente
  verified: false
  params:
    whole_value: true
    brackets:
      - {from: 0, rate: 0.08}
      - {from: 300000.01, rate: 0.09}
      - {from: 500000.01, rate: 0.10}
  source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2015-945#a26
  notes: "Decreto Legislativo 2/2014 de Asturias, art. 26, sin modificaciones en el texto consolidado a 31/12/2025: «el tipo de gravamen que resulte de la siguiente tarifa atendiendo al valor íntegro del bien o derecho»: 8 % entre 0 y 300.000 €; 9 % entre 300.000,01 y 500.000 €; 10 % por encima de 500.000 €. Es un tipo único por tramo sobre TODO el valor (no progresivo): un precio de 300.000,01 € paga el 9 % sobre los 300.000,01 €. Fecha de inicio = entrada en vigor del texto refundido (30/10/2014); la tarifa puede venir de antes (por verificar en la ley que la introdujo)."

# AJD de la escritura de compra de vivienda sujeta a IVA: tipo general de los documentos notariales,
# 1,2 % sobre todo el valor (único). Sin bandas ni salto de banda. Persona jurídica: el mismo tipo.
- id: asturias-ajd-compra-vivienda-2014
  kind: ajd_compra_vivienda
  territory: ES-03
  effective_from: 2014-10-30
  effective_to: null
  status: vigente
  verified: false
  params:
    bands:
      - {up_to: null, rate: 0.012}
    cap_jumps: false
  source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2015-945#a34
  notes: "Decreto Legislativo 2/2014 de Asturias, art. 34: «Con carácter general se aplicará el tipo del 1,2 por ciento en las primeras copias de escrituras y actas notariales sujetas como documentos notariales.» No incluye el 1,5 % de la renuncia a la exención del IVA (art. 36) ni los de VPP (art. 35) o vivienda destinada a alquiler (art. 38). Fecha de inicio = entrada en vigor del texto refundido (30/10/2014); por verificar si el 1,2 % ya regía antes."

