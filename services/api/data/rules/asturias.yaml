# Vivienda de uso turístico y vivienda vacacional en Asturias: Decreto 48/2016, de 10 de agosto, en la
# redacción del Decreto 4/2026, de 2 de febrero (BOPA núm. 28, 11/02/2026). Entra en vigor a los veinte
# días de su publicación (disposición final segunda): 03/03/2026. Los artículos citados son del Decreto 48/2016.
- id: asturias-alquiler-turistico
  kind: regimen_alquiler_turistico
  territory: ES-03
  effective_from: 2026-03-03
  effective_to: null
  status: vigente
  verified: false
  params:
    regime: "Vivienda de uso turístico (en edificio de propiedad horizontal) y vivienda vacacional en Asturias (Decreto 48/2016): declaración responsable previa e inscripción en el Registro de Empresas y Actividades Turísticas"
    requirements:
      - code: declaracion-responsable
        description: "Declaración responsable electrónica ante la Administración turística antes de iniciar la actividad; faculta para empezar el mismo día, con inscripción en el Registro de Empresas y Actividades Turísticas (arts. 29 y 31)"
        source_url: https://miprincipado.asturias.es/bopa/2026/02/11/2026-01087.pdf
      - code: certificado-comunidad-propietarios
        description: "Certificación de la Junta de la comunidad de propietarios que acredite la posibilidad de comercialización turística (arts. 27.c y 30.2.g), con la aprobación expresa de tres quintas partes de los propietarios que exige la Ley de Propiedad Horizontal"
        source_url: https://miprincipado.asturias.es/bopa/2026/02/11/2026-01087.pdf
      - code: zona-apta-y-limites-municipales
        description: "Estar en zona declarada apta por el Ayuntamiento; no pueden ser vivienda vacacional ni de uso turístico las de protección pública ni las de zonas declaradas no aptas, y las entidades locales pueden limitar el número por edificio, sector o zona (arts. 1.4, 2.3 y 13.1.g)"
        source_url: https://miprincipado.asturias.es/bopa/2026/02/11/2026-01087.pdf
      - code: licencia-de-uso-o-cedula
        description: "Licencia municipal de uso o cédula de segunda ocupación y uso residencial del inmueble (art. 13.1.a y k)"
        source_url: https://miprincipado.asturias.es/bopa/2026/02/11/2026-01087.pdf
      - code: seguro-responsabilidad-civil
        description: "Seguro de responsabilidad civil de explotación con cobertura mínima de 150.250 € y franquicia máxima de 602 € (art. 30.2.h)"
        source_url: https://miprincipado.asturias.es/bopa/2026/02/11/2026-01087.pdf
      - code: una-vivienda-por-referencia-catastral
        description: "Una sola vivienda por referencia catastral, salvo que se acredite la existencia de varias (art. 30.1.d)"
        source_url: https://miprincipado.asturias.es/bopa/2026/02/11/2026-01087.pdf
      - code: equipamiento-y-capacidad
        description: "Superficie mínima (25 m² útiles para 1 persona, 33 m² para 2, 15 m² por persona desde 3), un baño por cada cuatro plazas, máximo de 8 plazas y monitor de ruido en el salón (art. 13.1.e y j, 13.4 y 13.5)"
        source_url: https://miprincipado.asturias.es/bopa/2026/02/11/2026-01087.pdf
      - code: recepcion-y-numero-de-registro
        description: "Servicio de recepción presencial o a distancia en las 24 horas siguientes a la entrada (sin cajetines de llaves en la vía pública) y número de inscripción en toda la publicidad (arts. 13.2, 14.3 y 27.e)"
        source_url: https://miprincipado.asturias.es/bopa/2026/02/11/2026-01087.pdf
  source_url: https://miprincipado.asturias.es/bopa/2026/02/11/2026-01087.pdf
  notes: "Decreto 4/2026 (BOPA núm. 28, 11/02/2026), arts. 1, 2, 3, 5, 7, 12, 13, 14, 15, 17, 27, 29, 30 y 31 del Decreto 48/2016. Fecha de inicio calculada: veinte días tras la publicación. Las viviendas ya inscritas tienen doce meses (arts. 7.2, 13.1.e, 13.4 y 13.5) o seis meses (resto) para adaptarse (disposición transitoria única). Se excluyen los arrendamientos por más de cuatro meses seguidos a un mismo arrendatario (art. 1.3)."

