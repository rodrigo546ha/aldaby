# NO se escriben minimo_contribuyente ni minimo_descendientes: el art. 2 del Decreto Legislativo 1/2014
# (redacción de la Ley 11/2023) no fija importes propios, solo incrementa un 10 % los importes del mínimo
# del contribuyente mayor de 65 y de 75 años, del mínimo por el segundo, el tercero y el cuarto y siguientes
# descendientes, por ascendientes y por discapacidad. No cambia el mínimo general, el del primer
# descendiente ni el aumento por menor de tres años: es un cambio parcial, no un juego completo propio.

