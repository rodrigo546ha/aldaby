# Estancias turísticas en viviendas en Illes Balears. Versión anterior, desde el Decreto-ley 4/2025 (BOIB núm. 46,
# 15/04/2025, en vigor el 16/04/2025; convalidado por Resolución de 8 de mayo de 2025) hasta la Ley 4/2026.
# Cerrada el 2026-06-14, día de entrada en vigor de la Ley 4/2026 (BOIB núm. 74, 13/06/2026).
- id: baleares-alquiler-turistico-2025
  kind: regimen_alquiler_turistico
  territory: ES-04
  effective_from: 2025-04-16
  effective_to: 2026-06-14
  status: vigente
  verified: false
  params:
    regime: "Comercialización de estancias turísticas en viviendas de uso residencial (Ley 8/2012, arts. 49 a 52): declaración responsable ante la administración turística insular, solo en zonas aptas, con plazas turísticas y sin nuevas declaraciones en viviendas en propiedad horizontal"
    requirements:
      - code: declaracion-responsable
        description: "Presentar la declaración responsable de inicio de actividad (DRIAT) ante la administración turística insular antes de comercializar; sin DRIAT no se pueden comercializar estancias (arts. 50.3 y 52.3); la relación con la Administración es por medios electrónicos (art. 50.23)"
        source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2012-10610
      - code: zona-apta
        description: "Solo se pueden presentar nuevas declaraciones para viviendas en zonas declaradas aptas por el procedimiento del art. 5 (planes de intervención en ámbitos turísticos y ayuntamientos) o delimitadas provisionalmente según el art. 75 (art. 50.3)"
        source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2012-10610
      - code: sin-nuevas-dr-en-propiedad-horizontal
        description: "No se permite en todo el ámbito de las Illes Balears presentar nuevas declaraciones responsables de inicio de actividad relativas a viviendas sometidas al régimen de propiedad horizontal, excepto adosadas y aparejadas (sic); quedan excluidas las de la modalidad de alquiler de vivienda principal (Decreto-ley 4/2025, disposición adicional segunda)"
        source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2025-14462
      - code: plazas-turisticas
        description: "Acreditar la adquisición de las plazas turísticas (certificado, art. 50.22.e); mientras los consejos insulares no reevalúen la capacidad de carga, las nuevas plazas salen de las bolsas temporales gestionadas por el organismo gestor o la administración turística insular (Decreto-ley 4/2025, disposición transitoria segunda)"
        source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2025-14462
      - code: habitabilidad
        description: "Vivienda residencial con cédula de habitabilidad en vigor, título análogo de la administración insular o licencia de ocupación con el número de plazas (art. 50.2)"
        source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2012-10610
      - code: estatutos-y-junta-de-propietarios
        description: "En propiedad horizontal, el título constitutivo o los estatutos no pueden impedir la actividad y hace falta acuerdo de la junta de propietarios, salvo que ya la admitan expresamente (art. 50.7)"
        source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2012-10610
      - code: duracion-de-la-estancia
        description: "Cesión de la vivienda completa por periodos de corta duración, por días o semanas y sin que una estancia supere el mes (treinta noches); incompatible con contratos por habitaciones (art. 50.13 y 50.15)"
        source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2012-10610
      - code: antiguedad-minima
        description: "Antigüedad mínima de la vivienda, con uso residencial privado durante ese periodo: la que fije el reglamento y, en su defecto, cinco años (art. 50.17)"
        source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2012-10610
      - code: seguro-responsabilidad-civil
        description: "Póliza de responsabilidad civil por daños a los usuarios y, en propiedad horizontal, a la comunidad de propietarios (art. 50.16)"
        source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2012-10610
      - code: certificado-energetico-y-contadores
        description: "Certificado energético (en defecto de reglamento, mínimo F si es anterior a 31/12/2007 y D si es posterior a 01/01/2008) y contadores individuales de agua y suministros (art. 50.5 y 50.6)"
        source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2012-10610
      - code: exclusiones
        description: "No pueden comercializarse viviendas de protección oficial o de precio tasado, con sanción firme grave o muy grave de legalidad urbanística ni, para nuevas actividades, en suelo rústico protegido (art. 50.4, 50.8 y 50.18)"
        source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2012-10610
      - code: servicios-y-libro-registro
        description: "Garantizar limpieza, ropa de cama, menaje y mantenimiento, llevar el libro registro habilitado por la administración insular y dar asistencia telefónica las 24 horas (art. 51)"
        source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2012-10610
      - code: vigencia-de-cinco-anos
        description: "La DRIAT en viviendas en propiedad horizontal o edificios plurifamiliares habilita por cinco años (salvo reglamento), prorrogables si se siguen cumpliendo los requisitos y la zona sigue siendo apta (art. 50.3 y 50.22.c)"
        source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2012-10610
      - code: alquiler-vivienda-principal
        description: "Modalidad de alquiler de vivienda principal: persona física, vivienda propia que es su residencia habitual, máximo 60 días al año y en zona declarada apta para esta modalidad por los consejos insulares o el Ayuntamiento de Palma (art. 50.20)"
        source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2012-10610
  source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2012-10610
  notes: "Ley 8/2012, de 19 de julio, del turismo de las Illes Balears (BOE-A-2012-10610), texto consolidado a 13/06/2026, arts. 50 a 52; Decreto-ley 4/2025, de 11 de abril (BOE-A-2025-14462), DA 2.ª y DT 2.ª. Los apartados 2 y 20 del art. 50 vienen de la Ley 7/2024 y los apartados 12, 13 y 23 de la Ley 1/2025 y del Decreto-ley 4/2025. Redacción de los apartados anterior a 2025-04-16 y requisitos reglamentarios (Decreto 20/2015) no leídos. Cada isla tiene además su plan de intervención en ámbitos turísticos y su techo de plazas; no leídos."

