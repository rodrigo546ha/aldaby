# Illes Balears (ES-04) y municipio de Palma (ES-04-07040). Ver README.md.
# SIN VERIFICAR: ninguna pasa a verified: true hasta que Rodrigo lea la fuente.
# Texto consolidado del Decreto Legislativo 1/2014 y de la Ley 8/2012 leídos el 2026-11-03 en el BOE
# («Última actualización publicada el 13/06/2026» en ambos). Códigos INE comprobados en el diccionario
# del INE de 2025 (CODAUTO 04, CPRO 07): Palma 07040 y Eivissa 07026.
#
# PENDIENTE (sin fuente oficial leída, no se escribe):
# - Plusvalía de Eivissa (ES-04-07026): no se ha localizado la ordenanza vigente en una fuente oficial
#   accesible (la sede electrónica del Ayuntamiento prohíbe el acceso automatizado en su robots.txt y la
#   web municipal no enlaza el texto). Solo hay un anuncio del BOIB de 2014 con el 20 % (no vigente
#   necesariamente) y fuentes secundarias.
# - Plusvalía de Palma anterior a 2025 (la ordenanza que sustituye la modificación del Pleno de 26/05/2022):
#   solo se conoce su tipo por prensa.
# - Prohibición de Palma de nuevas plazas de estancias turísticas en viviendas en todo el término municipal
#   (aprobación definitiva del Pleno, 28/05/2026 según prensa): no se ha localizado el texto ni su
#   publicación en el BOIB, por lo que no se escribe la regla ES-04-07040. La prohibición en plurifamiliares
#   ya la recoge la regla autonómica (Decreto-ley 4/2025, disposición adicional segunda, para todo el
#   archipiélago). Tampoco se ha leído la modificación de 2018 de Palma sobre plurifamiliares.
# - Versiones del régimen turístico anteriores al 2025-04-16 (Decreto-ley 3/2024, Ley 7/2024).
# - Mínimos personales y familiares propios (minimo_contribuyente, minimo_descendientes): no se escriben,
#   ver nota más abajo.

# ITP de inmuebles, tipo general. El art. 10.c y d (4 % y 2 % para vivienda habitual de hasta 270.151,20 €,
# jóvenes, discapacidad, familias numerosas y monoparentales) no aplican a un inversor particular, ni el
# art. 10.b (garajes que no sean anexos a vivienda, hasta dos), ni el art. 11 (empresas de nueva creación).
# Es una tarifa PROGRESIVA por tramos (cada tipo solo en la parte del valor de su tramo); la ley aplica el
# «tipo medio» de la tarifa a toda la base, lo que da la misma cuota que la escala progresiva
# (400.000 x 8 % = 32.000; +200.000 x 9 % = 50.000; +400.000 x 10 % = 90.000; +1.000.000 x 12 % = 210.000).
# La ley redondea el tipo medio a dos decimales; esa diferencia de redondeo no se modela.
- id: baleares-itp-inmuebles-2023
  kind: impuesto_compra_segunda_mano
  territory: ES-04
  effective_from: 2023-01-01
  effective_to: null
  status: vigente
  verified: false
  params:
    brackets:
      - {from: 0, rate: 0.08}
      - {from: 400000, rate: 0.09}
      - {from: 600000, rate: 0.10}
      - {from: 1000000, rate: 0.12}
      - {from: 2000000, rate: 0.13}
  source_url: https://www.boe.es/eli/es-ib/dlg/2014/06/06/1/con
  notes: "Decreto Legislativo 1/2014 de las Illes Balears, art. 10.a, redacción de la Ley 11/2022 (en vigor el 01/01/2023; el texto consolidado a 13/06/2026 no la cambia: la Ley 12/2023 y la Ley 4/2026 solo tocan las letras c y d): 8 % hasta 400.000 €; 9 % de 400.000,01 a 600.000 €; 10 % hasta 1.000.000 €; 12 % hasta 2.000.000 €; 13 % en adelante. Tarifa progresiva por tramos, no el tipo del tramo sobre todo el valor."

# AJD de la escritura de compra de vivienda sujeta a IVA: tipo general de los documentos notariales (art. 15,
# 1,5 % desde el 01/01/2020, Ley 19/2019), que sube al 2 % cuando el valor del inmueble es igual o superior
# a 1.000.000 € (art. 17 bis, desde el 01/01/2023). El tipo se aplica a todo el valor; no hay salto de banda
# limitado ni tipo propio de persona jurídica. No incluye los reducidos del art. 17 (1 % y 0,5 % de vivienda
# habitual de hasta 270.151,20 €), ni las bonificaciones de los arts. 19 quater y 19 quinquies.
- id: baleares-ajd-compra-vivienda-2023
  kind: ajd_compra_vivienda
  territory: ES-04
  effective_from: 2023-01-01
  effective_to: null
  status: vigente
  verified: false
  params:
    bands:
      - {up_to: 999999.99, rate: 0.015}
      - {up_to: null, rate: 0.02}
    cap_jumps: false
  source_url: https://www.boe.es/eli/es-ib/dlg/2014/06/06/1/con
  notes: "Decreto Legislativo 1/2014 de las Illes Balears, art. 15 (1,5 %, redacción de la Ley 19/2019) y art. 17 bis (2 % si el valor real o declarado del inmueble es igual o superior a 1.000.000 €; añadido por la Ley 11/2022 y modificado por la Ley 12/2023 solo para excluir los derechos reales de garantía). La banda del 1,5 % llega hasta 999.999,99 € porque el 2 % se aplica desde 1.000.000 € inclusive."

