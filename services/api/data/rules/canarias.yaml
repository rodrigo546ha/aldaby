# Comunidad Autónoma de Canarias (ES-05) y municipios de Las Palmas de Gran Canaria (ES-05-35016) y
# Santa Cruz de Tenerife (ES-05-38038). Ver README.md.
# SIN VERIFICAR: ninguna pasa a verified: true hasta que Rodrigo lea la fuente.
# Fuentes leídas el 2026-11-03: Ley 9/2025 (BOC núm. 256, 29/12/2025), Ley 5/2024 (BOC núm. 260, 30/12/2024),
# DL 1/2009 (copia de Hacienda, Normadoc 2019, solo para los arts. 31 y 36), DL 1/2025 consolidado (BOE) y
# Ley 6/2025 (BOE-A-2025-26358).
#
# PENDIENTE (sin fuente oficial leída, no se escribe):
# - Texto consolidado actual del DL 1/2009: no se ha encontrado una versión oficial consolidada posterior a 2019;
#   los arts. 31 y 36 se han tomado de la copia de 2019 y de las leyes que los modifican (Ley 5/2024 y Ley 9/2025
#   no tocan el art. 36).
# - Escala autonómica del IRPF anterior a 2024 (no se carga: solo se cierra la de 2024).
# - Fecha de inicio exacta del IGIC general del 7 % antes del DL 1/2025.
# - Régimen urbanístico municipal del alquiler turístico de Las Palmas de Gran Canaria y Santa Cruz de Tenerife.
# - Resolución de zonas tensionadas del segundo trimestre de 2024 (no leída).

# ITP de inmuebles, tipo general (único, para todo el valor). El 5 % (vivienda habitual de hasta 200.000 €, sin
# otra vivienda) y los demás tipos reducidos de los arts. 32 a 34 no aplican a un inversor particular.
# Redacción vigente del art. 31.1.a (Ley 9/2025, DF 11.ª, con efecto 01/01/2025): 6,5 %. El 6,5 % ya estaba
# en la redacción de la Ley 4/2018 (en vigor desde el 05/12/2018).
- id: canarias-itp-inmuebles-2018
  kind: impuesto_compra_segunda_mano
  territory: ES-05
  effective_from: 2018-12-05
  effective_to: null
  status: vigente
  verified: false
  params: {rate: 0.065}
  source_url: https://www.gobiernodecanarias.org/boc/2025/256/4414.html
  notes: "Decreto Legislativo 1/2009 de Canarias, art. 31.1.a, redacción de la Ley 9/2025, de 23 de diciembre (BOC núm. 256, 29/12/2025, DF undécima, apartado diecinueve): transmisión de bienes inmuebles, con carácter general el 6,5 %, único para todo el valor (no por tramos). El 5 % exige vivienda habitual, base de hasta 200.000 € y no ser propietario de otra vivienda. Fecha de inicio = Ley 4/2018 según la copia de Hacienda del DL 1/2009 (art. 31 «en vigor desde 5 de diciembre de 2018»); el tipo general no ha cambiado."

# AJD de la escritura de compra de vivienda sujeta a IGIC o IVA: art. 36, 1 % (el general es el 0,75 %,
# pero «cuando se trate de documentos relativos a operaciones sujetas al IGIC o al IVA, el tipo se fija en el
# 1 por 100»). Sin bandas ni salto de banda. No incluye el 0,4 % del art. 37 (vivienda habitual).
- id: canarias-ajd-compra-vivienda-2016
  kind: ajd_compra_vivienda
  territory: ES-05
  effective_from: 2016-01-01
  effective_to: null
  status: vigente
  verified: false
  params:
    bands:
      - {up_to: null, rate: 0.01}
    cap_jumps: false
    legal_person_rate: 0.01
  source_url: https://www.hacienda.gob.es/DocLeyes/onlinelt/C13.13.tributos_cedidos_canarias.htm
  notes: "Decreto Legislativo 1/2009 de Canarias, art. 36, redacción de la Ley 11/2015 (en vigor desde 01/01/2016): 0,75 % en documentos notariales con carácter general y 1 % en los relativos a operaciones sujetas al IGIC o al IVA. Texto leído en la copia de Hacienda (Normadoc, 2019); la Ley 5/2024 y la Ley 9/2025 no modifican el art. 36 y Hacienda (Tributación autonómica 2026) sigue dando el 0,75 % general. Persona jurídica: mismo tipo. Por verificar que la entrega de vivienda nueva en IGIC no esté exenta de IGIC (en ese caso el tipo sería 0,75 %)."

# --- IGIC de la primera entrega de vivienda ------------------------------------------------------
# En Canarias no hay IVA: la entrega de vivienda nueva tributa por IGIC. Se carga con el kind
# iva_vivienda_nueva (la regla de ES lleva el IVA del 10 % y la más específica gana).
- id: canarias-igic-vivienda-nueva-2025
  kind: iva_vivienda_nueva
  territory: ES-05
  effective_from: 2025-10-21
  effective_to: null
  status: vigente
  verified: false
  params: {rate: 0.07}
  source_url: https://www.boe.es/buscar/pdf/2025/BOC-j-2025-90249-consolidado.pdf
  notes: "ESTO ES IGIC, NO IVA. Decreto Legislativo 1/2025, de 13 de octubre (BOC núm. 207, 20/10/2025; en vigor el día siguiente), art. 32.1: tipo general del IGIC del 7 %, aplicable a lo que no tenga otro tipo; no hay tipo específico para la primera entrega de vivienda libre. El art. 38 solo da tipo cero (VPO y promoción pública, entidades de arrendamiento del régimen especial del IS) y el 3 % superreducido (vivienda habitual del adquirente que sea persona de 40 años o menos, familia numerosa, discapacidad ≥65 %, víctima de violencia de género, familia monoparental o renta familiar de hasta 46.455 €, base de hasta 200.000 € y sin otra vivienda): ninguno aplica a un inversor. Fecha de inicio = entrada en vigor del texto refundido; el 7 % general viene de antes (por verificar desde cuándo)."

