# --- Alquiler ---------------------------------------------------------------------------------------

# Ninguna zona tensionada en Canarias: «Canarias» no figura en ninguna de las nueve resoluciones trimestrales
# del Ministerio leídas, desde la del primer trimestre de 2024 hasta la del segundo de 2026:
# BOE-A-2024-5214, BOE-A-2024-20576, BOE-A-2025-1721, BOE-A-2025-8636, BOE-A-2025-15728,
# BOE-A-2025-21901, BOE-A-2026-2448, BOE-A-2026-9175 y BOE-A-2026-16532. No se ha leído la del
# segundo trimestre de 2024. Revisar con cada resolución nueva y actualizar checked_through.
- id: canarias-zonas-tensionadas
  kind: zona_tensionada
  territory: ES-05
  effective_from: 2023-05-26
  effective_to: null
  status: vigente
  verified: false
  params: {declared: false, checked_through: 2026-07-29}
  source_url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-16532
  notes: "Ley 12/2023, art. 18: la declaración corresponde a la comunidad autónoma; el Ministerio publica la relación cada trimestre. Ley 6/2025 de Canarias, arts. 5.1.b y 10.2: una declaración de zona tensionada suspende la habilitación de nuevas viviendas de uso turístico."

# Vivienda de uso turístico en Canarias: Ley 6/2025, de 10 de diciembre (BOC núm. 246, 12/12/2025; en vigor
# el día siguiente a su publicación: 13/12/2025).
- id: canarias-alquiler-turistico
  kind: regimen_alquiler_turistico
  territory: ES-05
  effective_from: 2025-12-13
  effective_to: null
  status: vigente
  verified: false
  params:
    regime: "Uso turístico de hospedaje en vivienda en Canarias (Ley 6/2025): declaración responsable ante el cabildo insular, inscripción en el Registro General Turístico y habilitación expresa del planeamiento urbanístico"
    requirements:
      - code: declaracion-responsable
        description: "Declaración responsable ante el cabildo insular antes de iniciar la actividad, con inscripción de oficio en el Registro General Turístico de Canarias; trámite electrónico (art. 7.1 y 7.3)"
        source_url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2025-26358
      - code: habilitacion-planeamiento
        description: "El planeamiento urbanístico debe habilitar expresamente el uso turístico de la vivienda; se aporta cédula urbanística (arts. 4 y 7.7.c). Al menos el 90 % de la edificabilidad residencial se reserva a uso residencial exclusivo (art. 4.1)"
        source_url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2025-26358
      - code: antiguedad-minima
        description: "La vivienda debe tener al menos diez años de antigüedad (cinco en El Hierro, La Gomera y La Palma y municipios del reto demográfico), salvo que el planeamiento la reduzca fuera de zonas tensionadas (art. 5.1.a)"
        source_url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2025-26358
      - code: zona-no-tensionada
        description: "La declaración de zona de mercado residencial tensionado suspende la habilitación de nuevas viviendas de uso turístico mientras dure (art. 5.1.b)"
        source_url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2025-26358
      - code: estatutos-no-prohiben
        description: "En propiedad horizontal, el título constitutivo, los estatutos o la junta de propietarios no pueden impedir la actividad; se aporta certificación de la junta (arts. 5.1.c y 7.7.b)"
        source_url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2025-26358
      - code: no-proteccion-publica
        description: "La vivienda no puede estar sometida a protección pública que restrinja su destino ni formar parte de un establecimiento turístico (art. 7.4.d)"
        source_url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2025-26358
      - code: una-vivienda-por-referencia-catastral
        description: "Una sola vivienda por referencia catastral, salvo que se acredite la existencia de dos o más (art. 7.4.a)"
        source_url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2025-26358
      - code: vigencia-cinco-anos
        description: "La declaración habilita por cinco años (diez en El Hierro, La Gomera, La Palma y municipios del reto demográfico); después se renueva si se siguen cumpliendo los requisitos y la zona no es tensionada (art. 10)"
        source_url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2025-26358
  source_url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2025-26358
  notes: "Ley 6/2025, de 10 de diciembre, de Ordenación Sostenible del Uso Turístico de Viviendas (BOE-A-2025-26358). Sin perjuicio de la Ley 14/2019 en El Hierro, La Gomera y La Palma. Faltan el régimen transitorio (usos ya consolidados), los límites por sección electoral y las ordenanzas municipales de Las Palmas de Gran Canaria y Santa Cruz de Tenerife."

