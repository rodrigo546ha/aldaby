# Comunidad Autónoma de Cantabria (ES-06) y municipios de Santander (ES-06-39075) y Torrelavega (ES-06-39087).
# Ver README.md. SIN VERIFICAR: ninguna pasa a verified: true hasta que Rodrigo lea la fuente.
# Texto consolidado del Decreto Legislativo 62/2008 leído el 2026-11-03 (BOE, BOCT-c-2008-90028,
# «Última actualización, publicada el 30/04/2026, en vigor a partir del 01/05/2026»). Las redacciones
# anteriores se leyeron en las versiones históricas del mismo texto consolidado.
#
# PENDIENTE (sin fuente oficial leída, no se escribe):
# - Mínimos del contribuyente y por descendientes: Cantabria NO tiene mínimos propios (su art. 2 solo
#   regula deducciones sobre la cuota); rige el mínimo estatal también en el tramo autonómico.
# - Régimen urbanístico municipal del alquiler turístico de Santander y Torrelavega (informe municipal
#   de compatibilidad, art. 6.1.b del Decreto 50/2025): no se ha leído su planeamiento.
# - Tipo de la plusvalía de Santander anterior al 10/05/2022 y modificaciones de la ordenanza de
#   Torrelavega posteriores al 02/06/2022 (no se ha leído el BOC de 2025 ni de 2026 de Torrelavega).
# - Posibles modificaciones del Decreto 50/2025 posteriores al 24/07/2025.

# ITP de inmuebles, tipo general (único, para todo el valor). Los tipos reducidos del art. 9.2 a 9.8
# (vivienda habitual, menores de 40 años, familia numerosa o monoparental, discapacidad, municipios
# con riesgo de despoblamiento, rehabilitación, VPO, sociedades de jóvenes) no aplican a un inversor
# particular. Redacción vigente hasta el 31/12/2023: 10 %.
- id: cantabria-itp-inmuebles-2018
  kind: impuesto_compra_segunda_mano
  territory: ES-06
  effective_from: 2018-01-01
  effective_to: 2024-01-01
  status: vigente
  verified: false
  params: {rate: 0.10}
  source_url: https://www.boe.es/buscar/act.php?id=BOCT-c-2008-90028#a9
  notes: "Decreto Legislativo 62/2008 de Cantabria, art. 9.1.A (Tipo general), versión en vigor el 01/01/2018 (Ley 9/2017, BOE-A-2018-856) hasta el 31/12/2023: «tipo del 10 por ciento» en la transmisión de bienes inmuebles y constitución y cesión de derechos reales salvo los de garantía. Tipo único sobre todo el valor (no por tramos). En 2016-2017 el tipo general era el 8 % (no se escribe: anterior a 2024)."

- id: cantabria-itp-inmuebles-2024
  kind: impuesto_compra_segunda_mano
  territory: ES-06
  effective_from: 2024-01-01
  effective_to: null
  status: vigente
  verified: false
  params: {rate: 0.09}
  source_url: https://www.boe.es/buscar/act.php?id=BOCT-c-2008-90028#a9
  notes: "Decreto Legislativo 62/2008 de Cantabria, art. 9.1.A, redacción de la Ley 3/2023 (BOE-A-2024-1373, en vigor el 01/01/2024): «se aplicará el tipo del 9 por ciento». Tipo único sobre todo el valor (no por tramos): la escala 7 % hasta 300.000 € y 9 % por el exceso del art. 9.2 es solo para vivienda habitual. La Ley 5/2026 (BOE-A-2026-10431, en vigor el 01/05/2026) modificó los apartados 2, 3.c), 4 y 7 del art. 9, no el tipo general."

# AJD de la escritura de compra de vivienda sujeta a IVA: tipo general de las primeras copias de
# escrituras inscribibles, 1,5 % sobre todo el valor (único). Sin bandas ni salto de banda.
# No incluye el 1 % de la vivienda habitual ni los reducidos del art. 13.4 a 13.10.
- id: cantabria-ajd-compra-vivienda-2016
  kind: ajd_compra_vivienda
  territory: ES-06
  effective_from: 2016-01-01
  effective_to: null
  status: vigente
  verified: false
  params:
    bands:
      - {up_to: null, rate: 0.015}
    cap_jumps: false
  source_url: https://www.boe.es/buscar/act.php?id=BOCT-c-2008-90028#a13
  notes: "Decreto Legislativo 62/2008 de Cantabria, art. 13.3 (redacción de la Ley 3/2023 desde el 01/01/2024; en las versiones de 2016 a 2023 también 1,5 %): primeras copias de escrituras y actas notariales inscribibles, no sujetas a Sucesiones y Donaciones ni a TPO/IVA, tributan además al 1,5 %. Persona jurídica: mismo tipo (no hay tipo propio). Vivienda habitual: 1 %, y 0,1 % con requisitos (art. 13.4), no aplicables a un inversor."

