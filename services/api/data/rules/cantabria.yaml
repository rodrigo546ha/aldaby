# Ninguna zona tensionada en Cantabria: «Cantabria», «Santander» y «Torrelavega» no figuran en ninguna
# de las nueve resoluciones trimestrales del Ministerio leídas, desde la del primer trimestre de 2024
# hasta la del segundo de 2026: BOE-A-2024-5214, BOE-A-2024-20576, BOE-A-2025-1721, BOE-A-2025-8636,
# BOE-A-2025-15728, BOE-A-2025-21901, BOE-A-2026-2448, BOE-A-2026-9175 y BOE-A-2026-16532.
# No se ha leído la del segundo trimestre de 2024. Revisar con cada resolución nueva y actualizar checked_through.
- id: cantabria-zonas-tensionadas
  kind: zona_tensionada
  territory: ES-06
  effective_from: 2023-05-26
  effective_to: null
  status: vigente
  verified: false
  params: {declared: false, checked_through: 2026-07-29}
  source_url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-16532
  notes: "Ley 12/2023, art. 18: la declaración corresponde a la comunidad autónoma; el Ministerio publica la relación cada trimestre."

# Vivienda de uso turístico en Cantabria: Decreto 50/2025, de 24 de julio (BOC extraordinario núm. 15,
# 24/07/2025, CVE-2025-6592). Disposición final segunda: entra en vigor al día siguiente de su publicación
# (25/07/2025). Deroga el Decreto 225/2019.
- id: cantabria-alquiler-turistico
  kind: regimen_alquiler_turistico
  territory: ES-06
  effective_from: 2025-07-25
  effective_to: null
  status: vigente
  verified: false
  params:
    regime: "Vivienda de uso turístico en Cantabria (Decreto 50/2025): declaración responsable ante la Dirección General de Turismo antes de iniciar la actividad, con inscripción de oficio en el Registro General de Empresas Turísticas de Cantabria"
    requirements:
      - code: declaracion-responsable
        description: "Declaración responsable de apertura (Anexo I) ante la Dirección General competente en turismo, antes de iniciar la actividad; faculta para ejercerla desde el día de su presentación y se inscribe de oficio con carácter preventivo (arts. 5.1 y 6.2)"
        source_url: https://boc.cantabria.es/boces/verAnuncioAction.do?idAnuBlob=423179
      - code: titulo-juridico
        description: "Título jurídico suficiente de la propiedad o de un derecho de uso sobre la vivienda (art. 6.1.a)"
        source_url: https://boc.cantabria.es/boces/verAnuncioAction.do?idAnuBlob=423179
      - code: informe-compatibilidad-urbanistica
        description: "Informe municipal de compatibilidad de uso turístico con el planeamiento urbanístico (art. 6.1.b); los ayuntamientos pueden limitar con criterios objetivos el número de viviendas por edificio, sector, ámbito, periodo, área o zona (art. 4.2)"
        source_url: https://boc.cantabria.es/boces/verAnuncioAction.do?idAnuBlob=423179
      - code: certificado-tecnico-programa-minimo
        description: "Certificado de técnico competente de las condiciones del programa mínimo de vivienda, con la capacidad alojativa (art. 6.1.c)"
        source_url: https://boc.cantabria.es/boces/verAnuncioAction.do?idAnuBlob=423179
      - code: aprobacion-previa-comunidad-propietarios
        description: "Aprobación previa de la comunidad de propietarios en los términos de la Ley de Propiedad Horizontal, si el inmueble está en régimen de propiedad horizontal (art. 6.1.d)"
        source_url: https://boc.cantabria.es/boces/verAnuncioAction.do?idAnuBlob=423179
      - code: no-proteccion-publica
        description: "La vivienda no puede ser de protección pública calificada (arts. 1.4 y 6.1.f)"
        source_url: https://boc.cantabria.es/boces/verAnuncioAction.do?idAnuBlob=423179
      - code: seguridad-y-ruido
        description: "Un extintor por planta, un detector de humo junto a la cocina y un sistema de monitorización del ruido en los salones (art. 6.1.g)"
        source_url: https://boc.cantabria.es/boces/verAnuncioAction.do?idAnuBlob=423179
      - code: cesion-compartida-propietario-residente
        description: "Solo si se cede por habitaciones (cesión compartida): únicamente personas físicas, la persona propietaria debe residir en la vivienda y aportar certificado municipal de convivencia (arts. 3.b y 6.1.e)"
        source_url: https://boc.cantabria.es/boces/verAnuncioAction.do?idAnuBlob=423179
  source_url: https://boc.cantabria.es/boces/verAnuncioAction.do?idAnuBlob=423179
  notes: "Decreto 50/2025, de 24 de julio (BOC extraordinario núm. 15, 24/07/2025), arts. 1, 3, 4, 5 y 6; disposición final segunda (entrada en vigor al día siguiente de su publicación). Disposición transitoria única: las viviendas ya inscritas o con declaración anterior al 03/04/2025 quedan exentas del art. 6.1.d (aprobación de la comunidad) y deben presentar el Anexo V en 8 meses. Pendiente comprobar modificaciones posteriores al 24/07/2025."

