# Comunidad Autónoma de Castilla-La Mancha (ES-08). Ver README.md.
# SIN VERIFICAR: ninguna pasa a verified: true hasta que Rodrigo lea la fuente.
# Texto consolidado de la Ley 8/2013 leído el 2026-11-03: versión de la sede tributaria de la Junta
# (https://docm.jccm.es/portaldocm/descargarArchivo.do?ruta=1385469263266160074.doc&tipo=rutaCodigoLegislativo),
# «Actualizada a 30/03/2026». Su cabecera enumera las modificaciones: Ley 9/2014, Ley 3/2016,
# Ley 9/2019, Ley 11/2019, Ley 2/2021, Ley 4/2021, Ley 5/2021, Ley 1/2022, Ley 1/2023 y Ley 1/2026.
# El texto consolidado del BOE (BOE-A-2014-1368) está sin actualizar desde el 31/01/2023: no usarlo.
# Ley 1/2026 (DOCM núm. 61, 30/03/2026), art. 18, solo toca deducciones y los tipos REDUCIDOS del
# art. 19 (apartados 2, 6 y 9); no cambia el tipo general ni la escala.
#
# PENDIENTE (sin regla escrita):
# - minimo_contribuyente y minimo_descendientes: Castilla-La Mancha NO tiene mínimos propios en la
#   Ley 8/2013 vigente (solo deducciones que citan el mínimo estatal); rigen los del Estado.
# - tipo_plusvalia de Guadalajara: ver notas al final.
# - Régimen urbanístico municipal del alquiler turístico (Toledo, Guadalajara): no leído.
# - Resolución del Ministerio del tercer trimestre de 2026 (aún no localizada) y la del segundo de 2024.

# --- ITP de inmuebles: tipo general único (para todo el valor) -------------------------------------
# Los tipos reducidos del art. 19 (vivienda habitual de jóvenes, familias numerosas o monoparentales,
# discapacidad, zonas rurales por despoblación, etc.) no aplican a un inversor particular.
# Ley 8/2013 (en vigor el 01/01/2014) fijó el 8 %; la Ley 3/2016 lo subió al 9 %. Su capítulo II
# (medidas tributarias) surtió efectos el primer día del mes natural siguiente a la publicación en
# el DOCM (11/05/2016): 01/06/2016. Sin cambios en 2024, 2025 ni 2026 para el tipo general.
- id: castilla-la-mancha-itp-inmuebles-2016
  kind: impuesto_compra_segunda_mano
  territory: ES-08
  effective_from: 2016-06-01
  effective_to: null
  status: vigente
  verified: false
  params: {rate: 0.09}
  source_url: https://docm.jccm.es/portaldocm/descargarArchivo.do?ruta=1385469263266160074.doc&tipo=rutaCodigoLegislativo
  notes: "Ley 8/2013, de 21 de noviembre, de Medidas Tributarias de Castilla-La Mancha, art. 19.1, redacción de la Ley 3/2016, de 5 de mayo (BOE-A-2016-6725): a las transmisiones de inmuebles y a la constitución y cesión de derechos reales sobre ellos (salvo de garantía) «con carácter general, el tipo de gravamen del 9 por ciento». Tipo único para todo el valor, no por tramos."

# --- AJD de la escritura de compra de vivienda sujeta a IVA ----------------------------------------
# Documentos notariales del art. 31.2 TRLITPAJD: tipo general único del 1,50 % sobre todo el valor.
# Sin bandas, sin salto de banda y sin tipo propio de persona jurídica. No incluye los reducidos de
# los apartados 2 a 5 del art. 21 (vivienda habitual, zonas rurales, renuncia a la exención del IVA,
# locales de negocio). Original: 1,25 %; subido al 1,50 % por la Ley 3/2016 (misma entrada en vigor).
- id: castilla-la-mancha-ajd-compra-vivienda-2016
  kind: ajd_compra_vivienda
  territory: ES-08
  effective_from: 2016-06-01
  effective_to: null
  status: vigente
  verified: false
  params:
    bands:
      - {up_to: null, rate: 0.015}
    cap_jumps: false
  source_url: https://docm.jccm.es/portaldocm/descargarArchivo.do?ruta=1385469263266160074.doc&tipo=rutaCodigoLegislativo
  notes: "Ley 8/2013 de Castilla-La Mancha, art. 21.1, redacción de la Ley 3/2016 (BOE-A-2016-6725, art. 11.Siete): «con carácter general, el tipo de gravamen del 1,50 por ciento». Sin modificaciones posteriores del apartado 1 en el texto actualizado a 30/03/2026."

# --- IRPF, tramo autonómico (ADR-0007) --------------------------------------------------------------
# Escala autonómica general (art. 13 bis), añadida por la Ley 9/2014, de 4 de diciembre, que entró en
# vigor el 01/01/2015. El texto actualizado a 30/03/2026 la mantiene idéntica, por lo que rige también
# en los periodos impositivos 2025 y 2026: una sola regla.
- id: castilla-la-mancha-irpf-escala-general-2015
  kind: escala_irpf_general_autonomica
  territory: ES-08
  effective_from: 2015-01-01
  effective_to: null
  status: vigente
  verified: false
  params:
    brackets:
      - {from: 0, rate: 0.095}
      - {from: 12450, rate: 0.12}
      - {from: 20200, rate: 0.15}
      - {from: 35200, rate: 0.185}
      - {from: 60000, rate: 0.225}
  source_url: https://www.boe.es/boe/dias/2015/02/18/pdfs/BOE-A-2015-1628.pdf
