# --- Alquiler ----------------------------------------------------------------------------------------

# Ninguna zona tensionada en Castilla-La Mancha: ni la comunidad ni ninguno de sus municipios
# (Albacete, Ciudad Real, Cuenca, Guadalajara, Toledo) figuran en las diez resoluciones trimestrales
# del Ministerio leídas, desde la del primer trimestre de 2024 hasta la del segundo de 2026:
# BOE-A-2024-5214, BOE-A-2024-20576, BOE-A-2025-1721, BOE-A-2025-8636, BOE-A-2025-15728 (y su
# corrección BOE-A-2025-20246), BOE-A-2025-21901, BOE-A-2026-2448, BOE-A-2026-9175 y BOE-A-2026-16532.
# No se ha leído la del segundo trimestre de 2024 ni la del tercero de 2026. Revisar con cada
# resolución nueva y actualizar checked_through.
- id: castilla-la-mancha-zonas-tensionadas
  kind: zona_tensionada
  territory: ES-08
  effective_from: 2023-05-26
  effective_to: null
  status: vigente
  verified: false
  params: {declared: false, checked_through: 2026-07-29}
  source_url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-16532
  notes: "Ley 12/2023, art. 18: la declaración corresponde a la comunidad autónoma; el Ministerio publica la relación cada trimestre. Búsqueda por «Castilla-La Mancha» y por las cinco capitales de provincia sin resultados en las resoluciones citadas."

# Vivienda de uso turístico en Castilla-La Mancha: Decreto 36/2018, de 29 de mayo (DOCM núm. 113,
# 11/06/2018; entra en vigor a los veinte días de su publicación: 01/07/2018).
- id: castilla-la-mancha-alquiler-turistico
  kind: regimen_alquiler_turistico
  territory: ES-08
  effective_from: 2018-07-01
  effective_to: null
  status: vigente
  verified: false
  params:
    regime: "Vivienda de uso turístico en Castilla-La Mancha (Decreto 36/2018): declaración responsable de inicio de actividad e inscripción en el Registro de empresas y establecimientos turísticos antes de anunciarla"
    requirements:
      - code: declaracion-responsable
        description: "Declaración responsable de inicio de actividad, antes del inicio y de cualquier publicidad, ante la Dirección General de Turismo, solo por vía telemática con firma electrónica (art. 6.1 y 6.4)"
        source_url: https://docm.jccm.es/portaldocm/descargarArchivo.do?ruta=1528111832347830497.doc&tipo=rutaCodigoLegislativo
      - code: inscripcion-registro-turismo
        description: "Inscripción en el Registro de empresas y establecimientos turísticos de Castilla-La Mancha; su código debe figurar en toda publicidad y comercialización (arts. 6.6 y 16.4)"
        source_url: https://docm.jccm.es/portaldocm/descargarArchivo.do?ruta=1528111832347830497.doc&tipo=rutaCodigoLegislativo
      - code: estatutos-no-prohiben
        description: "Los estatutos de la comunidad de propietarios no pueden contener prohibición expresa de la actividad de alojamiento turístico (art. 16.1.b)"
        source_url: https://docm.jccm.es/portaldocm/descargarArchivo.do?ruta=1528111832347830497.doc&tipo=rutaCodigoLegislativo
      - code: habitabilidad-y-equipamiento
        description: "Cumplir la normativa de habitabilidad y seguridad de uso residencial; amueblada y equipada, con calefacción y aire acondicionado en dormitorios y salón, botiquín y wifi; mínimo salón-comedor, cocina, dormitorio y baño (art. 16.1 y 16.2)"
        source_url: https://docm.jccm.es/portaldocm/descargarArchivo.do?ruta=1528111832347830497.doc&tipo=rutaCodigoLegislativo
      - code: capacidad-maxima
        description: "Capacidad según camas y plazas convertibles (como máximo 2 plazas en el salón-comedor y 4 en dormitorios) sin superar la de la licencia de primera ocupación o, si no consta, 12 plazas (art. 16.3)"
        source_url: https://docm.jccm.es/portaldocm/descargarArchivo.do?ruta=1528111832347830497.doc&tipo=rutaCodigoLegislativo
      - code: uso-turistico-exclusivo
        description: "Cedida en su totalidad y de forma habitual para alojamiento turístico, sin poder usarse como residencia permanente ni con otra finalidad (arts. 2.c y 3)"
        source_url: https://docm.jccm.es/portaldocm/descargarArchivo.do?ruta=1528111832347830497.doc&tipo=rutaCodigoLegislativo
      - code: hojas-reclamaciones-y-placa
        description: "Hojas de reclamaciones a disposición de los usuarios y placa distintiva en la puerta de entrada (arts. 7 y 17)"
        source_url: https://docm.jccm.es/portaldocm/descargarArchivo.do?ruta=1528111832347830497.doc&tipo=rutaCodigoLegislativo
  source_url: https://docm.jccm.es/portaldocm/descargarArchivo.do?ruta=1528111832347830497.doc&tipo=rutaCodigoLegislativo
  notes: "Decreto 36/2018, de 29 de mayo, de ordenación de los apartamentos turísticos y las viviendas de uso turístico en Castilla-La Mancha, texto de la sede del DOCM sin notas de modificación. Pendiente comprobar si lo ha modificado alguna norma posterior (informes de prensa mencionan un anteproyecto de ley que exigiría la declaración responsable antes de anunciar; sin fuente oficial leída) y las limitaciones urbanísticas municipales."

