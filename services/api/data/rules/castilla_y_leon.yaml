# Ninguna zona tensionada en Castilla y León: ni «Castilla y León», ni Valladolid, ni Burgos, ni otra
# localidad de la comunidad figuran en las nueve resoluciones trimestrales del Ministerio leídas (texto
# completo, 2026-11-03): BOE-A-2024-5214, BOE-A-2024-20576, BOE-A-2025-1721, BOE-A-2025-8636,
# BOE-A-2025-15728, BOE-A-2025-21901, BOE-A-2026-2448, BOE-A-2026-9175 y BOE-A-2026-16532 (la última, de
# 24/07/2026, publicada el 29/07/2026, segundo trimestre de 2026). No se ha leído la del segundo trimestre de
# 2024 ni hay resolución del tercer trimestre de 2026 publicada que yo haya localizado. Revisar con cada
# resolución nueva y actualizar checked_through.
- id: castilla-y-leon-zonas-tensionadas
  kind: zona_tensionada
  territory: ES-07
  effective_from: 2023-05-26
  effective_to: null
  status: vigente
  verified: false
  params: {declared: false, checked_through: 2026-07-29}
  source_url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-16532
  notes: "Ley 12/2023, art. 18: la declaración corresponde a la comunidad autónoma; el Ministerio publica la relación cada trimestre."

# Vivienda de uso turístico en Castilla y León: Decreto 3/2017, de 16 de febrero (BOCYL núm. 33, 17/02/2017;
# en vigor el día siguiente, 18/02/2017), al amparo de la Ley 14/2010, de Turismo. La Orden CYT/1318/2019, de
# 18 de diciembre (BOCYL 24/12/2019), derogó el art. 3.2 (prohibición de cesión por estancias). Requisitos
# tomados del texto original del decreto y del procedimiento de la sede electrónica (actualizado 26/05/2026).
- id: castilla-y-leon-alquiler-turistico
  kind: regimen_alquiler_turistico
  territory: ES-07
  effective_from: 2017-02-18
  effective_to: null
  status: vigente
  verified: false
  params:
    regime: "Vivienda de uso turístico en Castilla y León (Decreto 3/2017): declaración responsable antes de iniciar la actividad e inscripción de oficio en el Registro de Turismo de Castilla y León"
    requirements:
      - code: declaracion-responsable
        description: "Declaración responsable por cada vivienda, ante la Sección de Turismo de la provincia, con anterioridad al inicio de la actividad; da lugar a la inscripción de oficio en el Registro de Turismo (art. 15)"
        source_url: https://bocyl.jcyl.es/eli/es-cl/d/2017/02/16/3/dof/spa/pdf
      - code: licencia-primera-ocupacion
        description: "Licencia de primera ocupación, cédula de habitabilidad o autorización municipal correspondiente, y cumplir las condiciones técnicas y de calidad (art. 7.1)"
        source_url: https://bocyl.jcyl.es/eli/es-cl/d/2017/02/16/3/dof/spa/pdf
      - code: vivienda-completa
        description: "Se cede la vivienda entera como una única unidad de alojamiento, amueblada y equipada para uso inmediato, a cambio de contraprestación (art. 3)"
        source_url: https://bocyl.jcyl.es/eli/es-cl/d/2017/02/16/3/dof/spa/pdf
      - code: dependencias-minimas
        description: "Dormitorio, salón-comedor, cocina y cuarto de baño o aseo (salvo estudios) y los requisitos de los arts. 8 a 12, incluidos servicios comunes como agua, electricidad, calefacción y botiquín (arts. 7.2 y 12)"
        source_url: https://bocyl.jcyl.es/eli/es-cl/d/2017/02/16/3/dof/spa/pdf
      - code: placa-identificativa
        description: "Placa identificativa según el modelo del anexo, en la entrada de la vivienda (art. 6)"
        source_url: https://bocyl.jcyl.es/eli/es-cl/d/2017/02/16/3/dof/spa/pdf
      - code: numero-registro-en-publicidad
        description: "Indicar el número de inscripción en el Registro de Turismo en la publicidad y la comercialización (art. 35.1)"
        source_url: https://bocyl.jcyl.es/eli/es-cl/d/2017/02/16/3/dof/spa/pdf
      - code: hojas-de-reclamacion
        description: "Disponer de hojas de reclamación a disposición de los turistas (art. 34)"
        source_url: https://bocyl.jcyl.es/eli/es-cl/d/2017/02/16/3/dof/spa/pdf
      - code: urbanismo-y-otras-normativas
        description: "El inmueble debe cumplir la normativa de urbanismo, edificación, sanidad, seguridad, incendios y accesibilidad (disposición adicional)"
        source_url: https://bocyl.jcyl.es/eli/es-cl/d/2017/02/16/3/dof/spa/pdf
  source_url: https://bocyl.jcyl.es/eli/es-cl/d/2017/02/16/3/dof/spa/pdf
  notes: "Decreto 3/2017 de Castilla y León, texto original (BOCYL 17/02/2017), sin las modificaciones posteriores salvo la derogación del art. 3.2 por la Orden CYT/1318/2019 (según la sede electrónica de la Junta). Habitualidad: más de un mes al año (art. 4.c). Pendiente comprobar otras modificaciones y la entrada en vigor de la Orden."

