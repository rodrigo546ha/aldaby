#
# Tributos cedidos: Decreto Legislativo 1/2013, de 12 de septiembre, texto refundido de las disposiciones
# legales de la Comunidad de Castilla y León en materia de tributos propios y cedidos (BOCL núm. 180,
# 18/09/2013; BOE-BOCL-h-2013-90254). Texto consolidado del BOE leído el 2026-11-03: «Última actualización
# publicada el 14/05/2024» (Ley 4/2024, de 9 de mayo, que solo toca deducciones). La web de tributos de la Junta
# (tributos.jcyl.es, IRPF) no lista ninguna norma autonómica de 2025 ni de 2026 sobre escala o mínimos.
# Códigos INE comprobados con el diccionario del INE (2026): 07 / 47 186 Valladolid, 07 / 09 059 Burgos.
#
# PENDIENTE (sin fuente oficial leída, no se escribe):
# - Cualquier ley autonómica posterior al 14/05/2024 que el BOE aún no consolide (comprobar en el BOCYL).
# - Régimen urbanístico municipal del alquiler turístico de Valladolid y Burgos.
# - Texto consolidado del Decreto 3/2017 con la Orden CYT/1318/2019 (derogación del art. 3.2): leído solo el
#   texto original del BOCYL; la derogación consta en la sede electrónica de la Junta.
# - Fecha de inicio exacta del 21 % de Burgos (la ordenanza leída es la del BOP de 08/01/2026) y del 21,76 % de
#   Valladolid (texto de 2022, 2025 y 2026 idéntico, vigencia del ejercicio por verificar en el BOP).

# --- ITP de inmuebles: tipo general con tramo incrementado (PROGRESIVO, no sobre todo el valor) ----------
# Art. 24.1.a): 8 % en la transmisión de inmuebles. Art. 25.1: si la base supera 250.000 €, se aplica el
# tipo general a esos 250.000 € y el 10 % solo a la parte que exceda: escala progresiva (sin whole_value).
# No aplican: 4 % vivienda habitual de familia numerosa, discapacidad >= 65 %, menores de 36 años y vivienda
# protegida (art. 25.3); 0,01 % vivienda habitual de menores de 36 años en municipios pequeños (art. 25.4);
# 4 % y 2 % para sede de empresas (art. 25.5 y 6); 4 % explotaciones agrarias (art. 25.7).
# Los arts. 24 y 25.1 mantienen su texto desde el original (en vigor el 19/09/2013).
- id: castilla-y-leon-itp-inmuebles-2013
  kind: impuesto_compra_segunda_mano
  territory: ES-07
  effective_from: 2013-09-19
  effective_to: null
  status: vigente
  verified: false
  params:
    brackets:
      - {from: 0, rate: 0.08}
      - {from: 250000, rate: 0.10}
  source_url: https://www.boe.es/buscar/act.php?id=BOCL-h-2013-90254#a25
  notes: "Decreto Legislativo 1/2013 de Castilla y León, art. 24.1.a): tipo general del 8 % en la transmisión de inmuebles; art. 25.1: «se aplicará el tipo general a esta cantidad [250.000 €] y un tipo incrementado del 10 por 100 a la parte de la base que exceda esta cantidad». Es progresivo: cada tipo solo sobre su tramo (el 10 % no se aplica a todo el valor). Texto original en vigor el 19/09/2013, sin cambios en estos apartados."

# --- AJD de la escritura de compra de vivienda sujeta a IVA ---------------------------------------------
# Art. 24.2: tipo general del 1,5 % en primeras copias de escrituras. El 2 % del art. 26.1 solo es para escrituras
# de transmisiones en que se renunció a la exención del IVA (art. 20.Dos de la Ley 37/1992), no para vivienda nueva.
# No incluye los reducidos del art. 26.2 (0,5 % vivienda habitual de familia numerosa, discapacidad,
# vivienda protegida y menores de 36 años) ni el 0,01 % del art. 26.3. Sin tipo propio para persona jurídica.
- id: castilla-y-leon-ajd-compra-vivienda-2013
  kind: ajd_compra_vivienda
  territory: ES-07
  effective_from: 2013-09-19
  effective_to: null
  status: vigente
  verified: false
  params:
    bands:
      - {up_to: null, rate: 0.015}
    cap_jumps: false
  source_url: https://www.boe.es/buscar/act.php?id=BOCL-h-2013-90254#a24
  notes: "Decreto Legislativo 1/2013 de Castilla y León, art. 24.2: «se aplicará el tipo general del 1,5 por 100» a las primeras copias de escrituras y actas notariales sujetas como documentos notariales a AJD, único para todo el valor (sin bandas ni salto de banda). Persona jurídica: el mismo tipo."

