# Cataluña (ES-09) y municipio de Barcelona (ES-09-08019). Ver README.md.
# SIN VERIFICAR: ninguna pasa a verified: true hasta que Rodrigo lea la fuente.
#
# Tributos cedidos: Código tributario de Cataluña, libro sexto (Decreto Legislativo 1/2024,
# de 12 de marzo, BOE-A-2024-6951; en vigor el 15/03/2024), con las modificaciones del
# Decreto-ley 5/2025, de 25 de marzo (BOE-A-2025-10270; convalidado por la Resolución 201/XV del
# Parlament, de 7 de mayo de 2025). Los arts. 4 y 5 del DL 5/2025 (ITP y AJD) entran en vigor a los
# tres meses del día siguiente al de su publicación en el DOGC (disposición final 2.2): 27/06/2025.
# El art. 3 (escala del IRPF) tiene efectos desde el 1 de enero de 2025.
#
# PENDIENTE (sin fuente oficial leída; no se escribe regla): ver el informe de la tanda.

# --- ITP de inmuebles: tarifa progresiva por tramos de valor (NO es un tipo único) ----------------
# «Tipo medio que resulta de aplicar la tarifa»: cada tipo se aplica SOLO al exceso de su tramo
# (cuota íntegra acumulada en la propia tarifa: 100.000 € a 1.000.000 € en la redacción de 2024; 60.000 €
# a 600.000 €, 93.000 € a 900.000 € y 165.000 € a 1.500.000 € en la de 2025).
# El esquema actual de impuesto_compra_segunda_mano solo admite `rate`: estas dos reglas NO
# cargan hasta que el catálogo admita `brackets` para este tipo (ver notas del informe).
# No aplican: 5 % vivienda habitual de jóvenes <=35 años con base <=36.000 € (art. 641-5), 5 % víctimas de
# violencia machista (art. 641-5 bis), familias numerosas y otros reducidos; 7 % vivienda protegida
# (art. 641-1.2). Aparte: 20 % sobre TODO el valor si la vivienda la adquiere un gran tenedor (más de 10
# inmuebles residenciales o más de 1.500 m² residenciales en Cataluña, o cinco o más en zona tensionada)
# y en compra de edificios enteros de viviendas (art. 641-1.5 y 641-1.6, desde el 27/06/2025).
- id: cataluna-itp-inmuebles-2024
  kind: impuesto_compra_segunda_mano
  territory: ES-09
  effective_from: 2024-03-15
  effective_to: 2025-06-27
  status: vigente
  verified: false
  params:
    brackets:
      - {from: 0, rate: 0.10}
      - {from: 1000000, rate: 0.11}
  source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2024-6951#a6-85
  notes: "Código tributario de Cataluña, libro sexto, art. 641-1.a) en la redacción original del Decreto Legislativo 1/2024: tarifa de inmuebles 10 % hasta 1.000.000 € y 11 % por el exceso (tipo medio, cada tipo sobre su tramo). Vigente hasta el 26/06/2025."

- id: cataluna-itp-inmuebles-2025
  kind: impuesto_compra_segunda_mano
  territory: ES-09
  effective_from: 2025-06-27
  effective_to: null
  status: vigente
  verified: false
  params:
    brackets:
      - {from: 0, rate: 0.10}
      - {from: 600000, rate: 0.11}
      - {from: 900000, rate: 0.12}
      - {from: 1500000, rate: 0.13}
  source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2025-10270
  notes: "Código tributario de Cataluña, libro sexto, art. 641-1.1, redacción del art. 5.1 del Decreto-ley 5/2025 (en vigor desde el 27/06/2025): 10 % hasta 600.000 €, 11 % de 600.000 a 900.000 €, 12 % de 900.000 a 1.500.000 € y 13 % por encima; tipo medio (cada tipo sobre el exceso de su tramo). Gran tenedor y edificios enteros: 20 % sobre todo el valor (art. 641-1.5 y 6), no modelado."

# --- AJD de la escritura de compra de vivienda sujeta a IVA --------------------------------------
# Art. 642-1: 1,5 % «en el caso de otros documentos» (letra d). El 3,5 % de la letra a) (2,5 % hasta el
# 26/06/2025) solo es para documentos en que se renunció a la exención del IVA (art. 20.2 de la Ley
# 37/1992), no para vivienda nueva. El 2 % de la letra b) es de préstamos hipotecarios (sujeto pasivo: el
# prestamista). Sin tipo propio para persona jurídica. No incluye la bonificación del 100 % del art. 642-6
# (primera vivienda habitual de menores de 36 años) ni las demás bonificaciones.
- id: cataluna-ajd-compra-vivienda-2024
  kind: ajd_compra_vivienda
  territory: ES-09
  effective_from: 2024-03-15
  effective_to: null
  status: vigente
  verified: false
  params:
    bands:
      - {up_to: null, rate: 0.015}
    cap_jumps: false
  source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2024-6951#a6-95
  notes: "Código tributario de Cataluña, libro sexto, art. 642-1.d), 1,5 % de cuota variable en otros documentos notariales (texto refundido, Decreto Legislativo 1/2024); la letra a), elevada al 3,5 % por el Decreto-ley 5/2025 desde el 27/06/2025, no afecta a la vivienda nueva sujeta a IVA sin renuncia a la exención."

