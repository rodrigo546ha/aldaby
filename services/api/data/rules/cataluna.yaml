# --- Alquiler de uso turístico ----------------------------------------------------------------------
# Requisitos autonómicos: Decreto 159/2012, de 20 de noviembre (DOGC 5/12/2012), arts. 66 a 68 en el
# texto consolidado del Portal Jurídic de Catalunya (marcado a 2017-03-31: no se han leído modificaciones
# posteriores), y Decreto-ley 3/2023, de 7 de noviembre (DOGC 8/11/2023, en vigor el 9/11/2023).
- id: cataluna-alquiler-turistico
  kind: regimen_alquiler_turistico
  territory: ES-09
  effective_from: 2023-11-09
  effective_to: null
  status: vigente
  verified: false
  params:
    regime: "Habitatge d'ús turístic en Cataluña: cesión onerosa de la vivienda entera, por estancias de temporada (31 días como máximo), con comunicación previa al ayuntamiento e inscripción en el Registro de Turismo de Cataluña"
    requirements:
      - code: comunicacion-previa-ayuntamiento
        description: "Comunicación previa de inicio de actividad al ayuntamiento, firmada por el propietario (y por el gestor, si lo hay), con datos de la vivienda y su capacidad máxima, teléfono de atención inmediata, empresa de asistencia y mantenimiento y declaración responsable de la cédula de habitabilidad (Decreto 159/2012, art. 68.1 a 3)"
        source_url: https://portaljuridic.gencat.cat/eli/es-ct/d/2012/11/20/159
      - code: registro-turismo-cataluna
        description: "Inscripción en el Registro de Turismo de Cataluña, a partir de los datos que los ayuntamientos trasladan a la Generalitat (Decreto 159/2012, art. 68.8)"
        source_url: https://portaljuridic.gencat.cat/eli/es-ct/d/2012/11/20/159
      - code: cedula-habitabilidad
        description: "Cédula de habitabilidad en vigor, condiciones técnicas de las viviendas y ocupación máxima la de la cédula (Decreto 159/2012, art. 67.1)"
        source_url: https://portaljuridic.gencat.cat/eli/es-ct/d/2012/11/20/159
      - code: vivienda-completa-estancia-maxima
        description: "Se cede la vivienda entera, no por estancias, y la estancia de temporada es de 31 días continuos como máximo (Decreto 159/2012, art. 66.2 y 66.3)"
        source_url: https://portaljuridic.gencat.cat/eli/es-ct/d/2012/11/20/159
      - code: uso-no-prohibido
        description: "No es posible si el uso turístico lo prohíbe la ordenación de usos del sector o los estatutos de la comunidad inscritos en el Registro de la Propiedad (Decreto 159/2012, art. 68.6)"
        source_url: https://portaljuridic.gencat.cat/eli/es-ct/d/2012/11/20/159
      - code: licencia-urbanistica-previa
        description: "En los municipios del anexo del Decreto-ley 3/2023 (problemas de acceso a la vivienda o alta concentración de viviendas turísticas), licencia urbanística previa de cinco años, prorrogable si el planeamiento lo permite; las viviendas ya habilitadas deben obtenerla en cinco años desde el 9/11/2023 o cesar (arts. 1 y 2 y disposición transitoria segunda)"
        source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2024-281
  source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2024-281
  notes: "Decreto-ley 3/2023, art. 1: licencia urbanística previa; art. 2: la relación de municipios del anexo tiene vigencia de cinco años desde su entrada en vigor o hasta la orden que la sustituya. El municipio de cada inmueble debe comprobarse en el anexo."

