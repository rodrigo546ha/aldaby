# --- IVA ------------------------------------------------------------------------------------

# Ley 37/1992, art. 91.Uno.1.7.º: 10 % en las entregas de viviendas (primera entrega; las
# segundas entregas están exentas y pagan ITP). El RDL 29/2026 no cambia este número.
# Desde 2013: antes hubo un 4 % temporal (RDL 9/2011, prorrogado hasta el 31/12/2012), no modelado.
- id: iva-vivienda-nueva-2013
  kind: iva_vivienda_nueva
  territory: ES
  effective_from: 2013-01-01
  effective_to: null
  status: vigente
  verified: false
  params: {rate: 0.10}
  source_url: https://www.boe.es/buscar/act.php?id=BOE-A-1992-28740#a91
  notes: "No incluye el 4 % de las VPO de régimen especial (art. 91.Dos.1.6.º)."

# Ley 37/1992, art. 90.Uno: 21 % desde el 01/09/2012 (RDL 20/2012). Se aplica a los honorarios
