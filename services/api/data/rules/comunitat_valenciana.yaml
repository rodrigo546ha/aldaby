# --- Alquiler turístico --------------------------------------------------------------------------
# Comunitat Valenciana: Ley 15/2018 de turismo (art. 65, redacción del Decreto-ley 9/2024) y
# Decreto 10/2021 del Consell (arts. 23 y 23 bis, redacción del Decreto-ley 9/2024, de 2 de agosto,
# DOGV núm. 9910 de 07/08/2024, en vigor el 08/08/2024).
- id: cv-alquiler-turistico
  kind: regimen_alquiler_turistico
  territory: ES-10
  effective_from: 2024-08-08
  effective_to: null
  status: vigente
  verified: false
  params:
    regime: "Vivienda de uso turístico en la Comunitat Valenciana: inmueble completo cedido por precio, con fines turísticos, por 10 días o menos a un mismo arrendatario; inscripción en el Registro de Turismo con validez de 5 años"
    requirements:
      - code: declaracion-responsable
        description: "Declaración responsable del titular con el contenido del art. 23 del Decreto 10/2021 (disponibilidad de la vivienda, referencia catastral única, licencia de primera o segunda ocupación, seguro, certificado energético, periodo de actividad, obligaciones fiscales…) e inscripción en el Registro de Turismo"
        source_url: https://dogv.gva.es/datos/2024/08/07/pdf/2024_8209_es.pdf
      - code: informe-compatibilidad-urbanistica
        description: "Informe municipal de compatibilidad urbanística para uso turístico favorable, o documento equivalente (Ley 15/2018, art. 65.1; Decreto 10/2021, art. 23.c)"
        source_url: https://dogv.gva.es/datos/2024/08/07/pdf/2024_8209_es.pdf
      - code: certificacion-comunidad-propietarios
        description: "Certificación registral o de la administración de la comunidad de que ni el título ni los estatutos ni un acuerdo oponible a terceros impiden un uso distinto de vivienda habitual (art. 23.l; no exigible en la renovación a las inscritas antes del 08/08/2024)"
        source_url: https://dogv.gva.es/datos/2024/08/07/pdf/2024_8209_es.pdf
      - code: seguro-responsabilidad-civil
        description: "Seguro de responsabilidad civil u otra garantía equivalente (art. 23.g, con remisión al art. 26 del Decreto 10/2021)"
        source_url: https://dogv.gva.es/datos/2024/08/07/pdf/2024_8209_es.pdf
      - code: vivienda-completa
        description: "Se cede la vivienda completa: el arrendamiento turístico de habitaciones queda prohibido (Ley 15/2018, art. 65.1 y 65.3.b)"
        source_url: https://dogv.gva.es/datos/2024/08/07/pdf/2024_8209_es.pdf
      - code: renovacion-cinco-anos
        description: "Renovación cada 5 años con nueva declaración responsable (dentro del mes anterior al vencimiento) e informe de compatibilidad actualizado; un cambio de propietario exige nueva declaración responsable (Decreto 10/2021, art. 23 bis)"
        source_url: https://dogv.gva.es/datos/2024/08/07/pdf/2024_8209_es.pdf
  source_url: https://dogv.gva.es/datos/2024/08/07/pdf/2024_8209_es.pdf
  notes: "Decreto-ley 9/2024, de 2 de agosto, del Consell (DOGV 07/08/2024; entra en vigor el día siguiente). Está por verificar si el Decreto-ley se convalidó o se sustituyó por ley y si el art. 23 del Decreto 10/2021 tiene modificaciones posteriores a 2024; se ha leído solo el texto del DOGV de 07/08/2024."

