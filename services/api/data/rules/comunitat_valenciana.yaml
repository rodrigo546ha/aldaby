# Comunitat Valenciana (ES-10) y municipios de València (ES-10-46250) y Alicante/Alacant (ES-10-03014).
# Ver README.md. SIN VERIFICAR: ninguna pasa a verified: true hasta que Rodrigo lea la fuente.
#
# Fuente de los tributos cedidos: Ley 13/1997, de 23 de diciembre, de la Generalitat, por la que se
# regula el tramo autonómico del IRPF y restantes tributos cedidos (BOE-A-1998-8202), texto
# consolidado del BOE con última actualización publicada el 10/08/2026 (Ley 5/2026, de 31 de julio).
#
# PENDIENTE (no se escribe regla):
# - Ninguna otra: ver notas de cada regla. El ITP va por tramos de valor y NO encaja en el
#   esquema actual (RateParams solo admite `rate`): `make rules-check` lo marca como error.

# --- ITP de inmuebles, tipo general (Ley 13/1997, art. 13.Uno) -----------------------------------
# Los tipos reducidos de los apartados Dos a Cinco (VPO, jóvenes menores de 35, familias numerosas,
# monoparentales, discapacidad, víctimas de violencia de género…) no aplican a un inversor particular.
# POR TRAMOS: un tipo para todo el valor; si el valor del inmueble supera 1.000.000 €, el tipo
# aplicable pasa a ser el 11 % sobre TODO el valor (no solo sobre el exceso): «cuando el valor […]
# sea superior a un millón de euros, el tipo aplicable será el 11 %». `from: 1000000.01` representa
# «superior a un millón». El apartado Ocho del art. 13 suma las adquisiciones de una misma finca
# registral al mismo transmitente en tres años como una sola transmisión.
- id: cv-itp-inmuebles-2023
  kind: impuesto_compra_segunda_mano
  territory: ES-10
  effective_from: 2023-01-01
  effective_to: 2026-06-01
  status: vigente
  verified: false
  params:
    brackets:
      - {from: 0, rate: 0.10}
      - {from: 1000000.01, rate: 0.11}
    whole_value: true
  source_url: https://www.boe.es/buscar/act.php?id=BOE-A-1998-8202#a13
  notes: "Ley 13/1997 de la Generalitat Valenciana, art. 13.Uno, redacción consolidada con vigencia desde el 01/01/2023 (10 % general; 11 % si el valor supera 1.000.000 €, sobre todo el valor). Dejó de aplicarse a los hechos imponibles devengados desde el 01/06/2026 (Ley 5/2025, art. 33). La fecha de inicio es la de la versión consolidada del BOE (tramo del 11 % introducido en la ley de medidas de 2022, BOE-A-2023-5482); falta leer el artículo de esa ley."

- id: cv-itp-inmuebles-2026
  kind: impuesto_compra_segunda_mano
  territory: ES-10
  effective_from: 2026-06-01
  effective_to: null
  status: vigente
  verified: false
  params:
    brackets:
      - {from: 0, rate: 0.09}
      - {from: 1000000.01, rate: 0.11}
    whole_value: true
  source_url: https://www.boe.es/buscar/act.php?id=BOE-A-1998-8202#a13
  notes: "Ley 13/1997 de la Generalitat Valenciana, art. 13.Uno, redacción del art. 33 de la Ley 5/2025, de 30 de mayo (BOE-A-2025-11959), «con efectos para los hechos imponibles devengados desde el 1 de junio de 2026 inclusive»: 9 % general; 11 % si el valor supera 1.000.000 €, sobre todo el valor."

# --- AJD de la escritura de compra de vivienda sujeta a IVA (art. 14) -----------------------------
# Un inversor no tiene vivienda habitual: no aplica el 0,1 % del art. 14.Uno.a (primeras copias de
# adquisiciones de vivienda habitual). Le corresponde el apartado Cuatro («en los demás casos»), una
# sola banda sobre todo el valor, sin salto de banda. El 2 % del apartado Dos es solo para
# transmisiones con renuncia a la exención del IVA (art. 20.dos LIVA), no para vivienda nueva.
- id: cv-ajd-compra-vivienda-2020
  kind: ajd_compra_vivienda
  territory: ES-10
  effective_from: 2020-01-01
  effective_to: 2026-06-01
  status: vigente
  verified: false
  params:
    bands:
      - {up_to: null, rate: 0.015}
    cap_jumps: false
  source_url: https://www.boe.es/buscar/act.php?id=BOE-A-1998-8202#a14
  notes: "Ley 13/1997 de la Generalitat Valenciana, art. 14.Cuatro, «En los demás casos, el 1,5 por 100» (versión consolidada con vigencia desde el 01/01/2020, BOE-A-2020-1010; 1,5 % desde la versión de 2013). Hasta los hechos imponibles devengados el 31/05/2026."

- id: cv-ajd-compra-vivienda-2026
  kind: ajd_compra_vivienda
  territory: ES-10
  effective_from: 2026-06-01
  effective_to: null
  status: vigente
  verified: false
  params:
    bands:
      - {up_to: null, rate: 0.014}
    cap_jumps: false
  source_url: https://www.boe.es/buscar/act.php?id=BOE-A-1998-8202#a14
  notes: "Ley 13/1997 de la Generalitat Valenciana, art. 14.Cuatro, redacción del art. 34 de la Ley 5/2025, de 30 de mayo (BOE-A-2025-11959), «con efectos para los hechos imponibles devengados desde el 1 de junio de 2026 inclusive»: «En los demás casos, el 1,4 por 100». No se carga legal_person_rate: la ley valenciana no distingue por tipo de sujeto."

