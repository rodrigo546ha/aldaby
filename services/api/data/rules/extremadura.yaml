      - {from: 0, rate: 0.0775}
      - {from: 12450, rate: 0.0975}
      - {from: 20200, rate: 0.16}
      - {from: 24200, rate: 0.175}
      - {from: 35200, rate: 0.21}
      - {from: 60000, rate: 0.235}
      - {from: 80200, rate: 0.24}
      - {from: 99200, rate: 0.245}
      - {from: 120200, rate: 0.25}
