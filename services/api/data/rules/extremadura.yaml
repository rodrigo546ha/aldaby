# Comunidad Autónoma de Extremadura (ES-11) y municipios de Badajoz (ES-11-06015) y Cáceres (ES-11-10037).
# Ver README.md. SIN VERIFICAR: ninguna pasa a verified: true hasta que Rodrigo lea la fuente.
# Texto consolidado del Decreto Legislativo 1/2018 leído el 2026-11-03 (BOE, «Última actualización
# publicada el 04/08/2026»); Ley 2/2026 (BOE-A-2026-17839) leída el mismo día.
#
# PENDIENTE (sin fuente oficial leída, no se escribe):
# - Mínimos del contribuyente y por descendientes: Extremadura NO tiene mínimos propios (el texto
#   refundido remite al art. 58 de la Ley 35/2006), por lo que no se escriben esas reglas.
# - Régimen de «vivienda de uso turístico» propiamente dicha: la Junta tramita la cesión de la vivienda
#   completa como apartamento turístico (Decreto 182/2012); no se ha encontrado una norma específica.
# - Fecha exacta del BOP de entrada en vigor de las ordenanzas de plusvalía de Badajoz y Cáceres.

# ITP de inmuebles, tipo general. Los tipos reducidos de los arts. 39 a 44 ter (vivienda protegida,
# vivienda habitual de jóvenes, colectivos, empresas y zonas rurales) no aplican a un inversor particular.
# La Ley 2/2026 no modifica el art. 36. La tarifa figura ya en el texto original del texto refundido
# (en vigor el 24/05/2018); si es anterior a esa fecha no se ha comprobado.
- id: extremadura-itp-inmuebles-2018
  kind: impuesto_compra_segunda_mano
  territory: ES-11
  effective_from: 2018-05-24
  effective_to: null
  status: vigente
  verified: false
  params:
    brackets:
      - {from: 0, rate: 0.08}
      - {from: 360000, rate: 0.10}
      - {from: 600000, rate: 0.11}
  source_url: https://www.boe.es/eli/es-ex/dlg/2018/04/10/1/con
  notes: "Decreto Legislativo 1/2018, de 10 de abril, de Extremadura (BOE-A-2018-8159), art. 36: tarifa progresiva, 8 % hasta 360.000 €, 10 % entre 360.000,01 y 600.000 € y 11 % por encima; el apartado 2 dice que la cuota es la suma de las cuotas de cada escalón con su tipo propio, es decir, PROGRESIVA por porción (no whole_value)."

# AJD de la escritura de compra de vivienda sujeta a IVA: tipo general de los documentos notariales,
# 1,5 % sobre todo el valor (único). Sin bandas ni salto de banda. No incluye el 0,5 % de la vivienda
# habitual de hasta 200.000 € (art. 47), el de vivienda protegida (47 bis) ni los de zonas rurales (50 bis).
# El 3 % del art. 51 es solo para escrituras con renuncia a la exención del IVA (inmuebles usados).
- id: extremadura-ajd-compra-vivienda-2018
  kind: ajd_compra_vivienda
  territory: ES-11
  effective_from: 2018-05-24
  effective_to: null
  status: vigente
  verified: false
  params:
    bands:
      - {up_to: null, rate: 0.015}
    cap_jumps: false
  source_url: https://www.boe.es/eli/es-ex/dlg/2018/04/10/1/con
  notes: "Decreto Legislativo 1/2018 de Extremadura, art. 46: «tipo general del 1,50 %» en las primeras copias de escrituras y actas notariales sujetas como Documentos Notariales. Persona jurídica: mismo tipo (no hay tipo propio). Texto idéntico en las versiones consolidadas de 2018 a 2026 (la Ley 2/2026 no toca el art. 46)."

# --- IRPF, tramo autonómico (ADR-0007) -------------------------------------------------------
# Escala vigente en 2023-2025: Decreto-ley 4/2023, de 12 de septiembre (DOE núm. 178, 15/09/2023;
