# --- Alquiler ---------------------------------------------------------------------------------

# Ninguna zona tensionada en Extremadura: ni «Extremadura» ni «Badajoz» ni «Cáceres» figuran en las
# resoluciones trimestrales del Ministerio leídas: BOE-A-2026-9175 (primer trimestre de 2026) y
# BOE-A-2026-16532 (segundo trimestre de 2026). No se han leído las resoluciones anteriores
# de 2024 y 2025. Revisar con cada resolución nueva y actualizar checked_through.
- id: extremadura-zonas-tensionadas
  kind: zona_tensionada
  territory: ES-11
  effective_from: 2023-05-26
  effective_to: null
  status: vigente
  verified: false
  params: {declared: false, checked_through: 2026-07-29}
  source_url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-16532
  notes: "Ley 12/2023, art. 18: la declaración corresponde a la comunidad autónoma; el Ministerio publica la relación cada trimestre. Resolución de 24/07/2026 de la Secretaría de Estado de Vivienda y Agenda Urbana (segundo trimestre de 2026)."

# Alquiler de la vivienda completa a turistas en Extremadura: no hay decreto específico de «viviendas
# de uso turístico»; la Junta lo tramita como apartamento turístico (Decreto 182/2012, art. 2.1, que
# cita el art. 61 de la Ley 2/2011) mediante declaración responsable, con inscripción de oficio en el
# Registro General de Empresas y Actividades Turísticas (Decreto 205/2012).
- id: extremadura-alquiler-turistico
  kind: regimen_alquiler_turistico
  territory: ES-11
  effective_from: 2012-09-14
  effective_to: null
  status: vigente
  verified: false
  params:
    regime: "Apartamento turístico en Extremadura (Decreto 182/2012): declaración responsable ante la Dirección General de Turismo e inscripción de oficio en el Registro General de Empresas y Actividades Turísticas"
    requirements:
      - code: declaracion-responsable
        description: "Declaración responsable de inicio de actividad ante la Dirección General de Turismo; se puede iniciar la actividad desde su presentación y la actividad se inscribe de oficio en el Registro General de Empresas y Actividades Turísticas de Extremadura"
        source_url: https://www.juntaex.es/w/5826
      - code: cesion-completa-con-cocina
        description: "Se cede el uso de la totalidad del apartamento, con instalaciones para preparar, conservar y consumir alimentos dentro de cada unidad (Decreto 182/2012, art. 2.1)"
        source_url: https://www.juntaex.es/w/5826
      - code: seguro-responsabilidad-civil
        description: "Seguro de responsabilidad civil vigente, con cobertura suficiente y al corriente de pago"
        source_url: https://www.juntaex.es/w/5826
      - code: titulo-disponibilidad
        description: "Título que acredite la plena disponibilidad del inmueble (por ejemplo, nota simple del Registro de la Propiedad)"
        source_url: https://www.juntaex.es/w/5826
      - code: memoria-y-planos
        description: "Memoria descriptiva y planos a escala firmados por facultativo competente"
        source_url: https://www.juntaex.es/w/5826
      - code: tasas
        description: "Pago de la tasa de tramitación y primera visita de comprobación, y del Libro de Inspección (modelo 50)"
        source_url: https://www.juntaex.es/w/5826
  source_url: https://www.juntaex.es/w/5826
  notes: "Requisitos tal como los publica la sede de la Junta (ficha actualizada el 13/10/2026). Decreto 182/2012, de 7 de septiembre (DOE núm. 178, 13/09/2012; en vigor al día siguiente, de ahí el inicio). La ficha no menciona expresamente «viviendas de uso turístico»: por verificar con la Dirección General de Turismo si una vivienda particular encaja siempre en el trámite de apartamento turístico. No se han leído los requisitos técnicos de clasificación por categorías del decreto."

