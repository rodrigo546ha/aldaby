  verified: false
  params: {declared: true, checked_through: 2026-07-29}
  source_url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2025-15728
  notes: "A Coruña. Resolución de 30/05/2025 de la presidenta del Instituto Gallego de la Vivienda y Suelo (declaración a solicitud del ayuntamiento); efectos desde el día siguiente a la publicación de la resolución del Ministerio en el BOE (29/07/2025) y vigencia de tres años desde ese día siguiente. Gran tenedor particularizado: más de diez inmuebles urbanos de uso residencial o más de 1.500 m² construidos de uso residencial, sin garajes ni trasteros. Aplica la limitación del art. 17.7 de la LAU (contratos sobre inmuebles sin contrato en los últimos cinco años). Corrección de erratas de enlaces: BOE-A-2025-20246."

