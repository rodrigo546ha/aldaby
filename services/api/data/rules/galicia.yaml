# Galicia no ha declarado zona tensionada a nivel de comunidad: la declaración se hace municipio a
# municipio, a solicitud del ayuntamiento, por la presidenta del Instituto Gallego de la Vivienda y Suelo
# (Ley 8/2012, disposición adicional 24.ª). Hay dos municipios declarados (A Coruña y Santiago de
# Compostela, abajo). Ningún otro municipio gallego figura en las nueve resoluciones trimestrales leídas
# (1.º de 2024 a 2.º de 2026): BOE-A-2024-5214, BOE-A-2024-20576, BOE-A-2025-1721, BOE-A-2025-8636,
# BOE-A-2025-15728 (y su corrección BOE-A-2025-20246), BOE-A-2025-21901, BOE-A-2026-2448, BOE-A-2026-9175
# y BOE-A-2026-16532. Vigo no figura. Falta la del tercer trimestre de 2026. Revisar con cada resolución
# nueva y actualizar checked_through.
- id: galicia-zonas-tensionadas
  kind: zona_tensionada
  territory: ES-12
  effective_from: 2023-05-26
  effective_to: null
  status: vigente
  verified: false
  params: {declared: false, checked_through: 2026-07-29}
  source_url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-16532
  notes: "Ley 12/2023, art. 18: la declaración corresponde a la comunidad autónoma; el Ministerio publica la relación cada trimestre. Sin declaración de ámbito autonómico: solo municipios concretos (reglas ES-12-15030 y ES-12-15078)."

