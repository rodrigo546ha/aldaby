# Vivienda de uso turístico en Galicia: Decreto 12/2017, de 26 de enero (DOG 10/02/2017; entra en vigor a
# los tres meses de su publicación). Texto «Última versión» de Lex.gal (Xunta de Galicia).
- id: galicia-alquiler-turistico
  kind: regimen_alquiler_turistico
  territory: ES-12
  effective_from: 2017-05-11
  effective_to: null
  status: vigente
  verified: false
  params:
    regime: "Vivienda de uso turístico en Galicia (Decreto 12/2017): cesión de la vivienda completa por estancias de menos de 30 días, de forma reiterada (dos o más veces al año), con declaración responsable previa ante la Axencia Turismo de Galicia"
    requirements:
      - code: declaracion-responsable
        description: "Declaración responsable de inicio de actividad (anexo V) ante el área provincial de la Axencia Turismo de Galicia, con tasa previa; da lugar a la inscripción de oficio en el Registro de Empresas y Actividades Turísticas de Galicia (arts. 5.4, 41.1, 42 y 43)"
        source_url: https://www.lex.gal/es/normativa/detalle/3031/pdf/
      - code: vivienda-completa
        description: "La cesión es de la totalidad de la vivienda, sin cesión por estancias o habitaciones; amueblada y equipada para su uso inmediato (arts. 5.1 y 39.1)"
        source_url: https://www.lex.gal/es/normativa/detalle/3031/pdf/
      - code: suelo-residencial-y-limites-municipales
        description: "Situada en suelo de uso residencial (u otro, si la normativa urbanística lo permite); los concellos pueden limitar el número máximo de viviendas de uso turístico por edificio o sector (art. 5.6)"
        source_url: https://www.lex.gal/es/normativa/detalle/3031/pdf/
      - code: estatutos-y-ordenacion-no-prohiben
        description: "No puede destinarse a esta actividad si lo prohíbe la ordenación de usos del sector o los estatutos de la comunidad inscritos en el Registro de la Propiedad (art. 41.5)"
        source_url: https://www.lex.gal/es/normativa/detalle/3031/pdf/
      - code: documentacion-de-la-vivienda
        description: "Disponer del título que acredite la libre disponibilidad de la vivienda, licencia de primera ocupación o cédula de habitabilidad (o equivalente), y seguro de responsabilidad civil que cubra a los usuarios (art. 41.2.e)"
        source_url: https://www.lex.gal/es/normativa/detalle/3031/pdf/
      - code: servicios-minimos
        description: "Calefacción (salvo uso solo de junio a septiembre), teléfono 24 horas, servicio de asistencia y mantenimiento, y hojas de reclamación de turismo con copia de la declaración responsable visibles (art. 39.2)"
        source_url: https://www.lex.gal/es/normativa/detalle/3031/pdf/
  source_url: https://www.lex.gal/es/normativa/detalle/3031/pdf/
  notes: "Decreto 12/2017, arts. 5, 39, 41 a 43, según el texto «Última versión» de Lex.gal (informativo). Fecha de inicio calculada: tres meses desde el DOG de 10/02/2017 (fuente secundaria: vLex da 11/05/2017); por verificar en el DOG. No se ha comprobado si el decreto tuvo modificaciones posteriores."

