# Comunidad Autónoma de Galicia (ES-12) y municipios de A Coruña (ES-12-15030), Santiago de Compostela
# (ES-12-15078) y Vigo (ES-12-36057). Ver README.md.
# SIN VERIFICAR: ninguna pasa a verified: true hasta que Rodrigo lea la fuente.
# Texto consolidado del Decreto legislativo 1/2011 leído el 2026-11-03 (BOE-A-2011-18161, «Última
# actualización publicada el 27/03/2026»), y las leyes autonómicas que lo modifican (BOE-A-2022-3415,
# BOE-A-2023-6382 y BOE-A-2024-2777).
#
# PENDIENTE (sin fuente oficial leída, no se escribe):
# - Resolución trimestral del Ministerio de Vivienda del tercer trimestre de 2026 (la de octubre): no se ha
#   localizado; Taxdown cuenta dos municipios gallegos (A Coruña y Santiago), los mismos de aquí.
# - Posibles modificaciones del Decreto 12/2017 (vivienda de uso turístico) posteriores a su texto
#   original y régimen urbanístico municipal del alquiler turístico en A Coruña, Vigo y Santiago.
# - Modificaciones de la ordenanza del IIVTNU de Vigo posteriores al BOP de 30/03/2022 (el Concello aprobó
#   en 2024 un paquete de ordenanzas para 2025; no se ha leído si tocó la plusvalía).
# - Mínimos por ascendientes y por discapacidad de Galicia (art. 4 bis.3 y 4): el esquema de reglas no
#   los admite todavía.

# ITP de inmuebles, tipo general (único, para todo el valor): 9 % hasta el 31/12/2023. Los tipos
# reducidos del art. 14.Dos y siguientes (vivienda habitual, familias numerosas, discapacidad,
# jóvenes, etc.) no aplican a un inversor particular.
- id: galicia-itp-inmuebles-2022
  kind: impuesto_compra_segunda_mano
  territory: ES-12
  effective_from: 2022-01-01
  effective_to: 2024-01-01
  status: vigente
  verified: false
  params: {rate: 0.09}
  source_url: https://www.boe.es/eli/es-ga/dlg/2011/07/28/1/con/20221230
  notes: "Decreto legislativo 1/2011 de Galicia, art. 14.Uno.1, redacción de la Ley 18/2021, de 27 de diciembre, de medidas fiscales y administrativas (BOE-A-2022-3415; entrada en vigor el 01/01/2022): tipo del 9 % en la transmisión de bienes inmuebles y constitución y cesión de derechos reales, salvo los de garantía. Tipo único sobre todo el valor, no por tramos."

# ITP de inmuebles, tipo general desde el 01/01/2024: 8 %, único para todo el valor.
- id: galicia-itp-inmuebles-2024
  kind: impuesto_compra_segunda_mano
  territory: ES-12
  effective_from: 2024-01-01
  effective_to: null
  status: vigente
  verified: false
  params: {rate: 0.08}
  source_url: https://www.boe.es/eli/es-ga/dlg/2011/07/28/1/con
  notes: "Decreto legislativo 1/2011 de Galicia, art. 14.Uno.1, redacción del art. 4 de la Ley 10/2023, de 28 de diciembre, de medidas fiscales y administrativas (BOE-A-2024-2777; DOG núm. 246, 29/12/2023; entra en vigor el 01/01/2024): «el tipo de gravamen aplicable a la transmisión de bienes inmuebles, así como en la constitución y cesión de derechos reales que recaigan sobre ellos, excepto los derechos reales de garantía, será del 8 %». Tipo único para todo el valor (no por tramos). El texto consolidado a 27/03/2026 lo mantiene."

# AJD de la escritura de compra de vivienda sujeta a IVA: tipo general de los documentos notariales,
# 1,5 % sobre todo el valor (único). Sin bandas ni salto de banda. Persona jurídica: el mismo tipo.
- id: galicia-ajd-compra-vivienda-2013
  kind: ajd_compra_vivienda
  territory: ES-12
  effective_from: 2013-03-01
  effective_to: null
  status: vigente
  verified: false
  params:
    bands:
      - {up_to: null, rate: 0.015}
    cap_jumps: false
  source_url: https://www.boe.es/eli/es-ga/dlg/2011/07/28/1/con
  notes: "Decreto legislativo 1/2011 de Galicia, art. 15.Uno: «en las primeras copias de escrituras o actas notariales sujetas a la modalidad de actos jurídicos documentados, cuota variable de los documentos notariales [...] el tipo de gravamen aplicable será del 1,5 %». No incluye los reducidos de vivienda habitual (1 %, art. 15.Dos), discapacidad (0,5 %, art. 15.Tres) ni familias numerosas (art. 15.Cuatro). Fecha de inicio: la redacción de 1,5 % aparece en la versión consolidada publicada el 28/02/2013 (antes, 1 %); una fuente secundaria la atribuye a la Ley 2/2013, de presupuestos de Galicia, en vigor el 01/03/2013: por verificar en el DOG."

