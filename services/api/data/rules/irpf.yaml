# IRPF: rendimientos del capital inmobiliario por alquiler de vivienda. Ver README.md.
# Valores copiados del texto consolidado del BOE (consultado el 2026-10-28).
# SIN VERIFICAR: ninguna pasa a verified: true hasta que Rodrigo lea la fuente
# (lista de comprobación en docs/normativa/verificacion-tanda-1.md).

# Cada caso declara en `when` los hechos del contrato que exige (vocabulario en
# regulation/kinds.py, RentalFacts); se aplica el de mayor reducción entre los que se cumplen.
# La vigencia de las reducciones se cuenta por FECHA DE CELEBRACIÓN DEL CONTRATO de
# arrendamiento: la regla aplicable es la de la fecha en que se firma el contrato.

# Art. 23.2 en la redacción de la Ley 12/2023 (disp. final 2.1), en vigor el 1 de enero de 2024
# para contratos celebrados desde el 26 de mayo de 2023. El RDL 29/2026 la mantiene para los
# contratos celebrados hasta el 1 de diciembre de 2026 (disp. transitoria 38.ª de la Ley del IRPF).
# Si el RDL 29/2026 se convalida, esta regla se cierra con effective_to: 2026-12-01.
# No modela el RDL 26/2026, en vigor del 1 al 2 de octubre de 2026 y derogado por el Congreso.
- id: irpf-reduccion-alquiler-ley-12-2023
  kind: reduccion_irpf_alquiler
  territory: ES
  effective_from: 2024-01-01
  effective_to: null
  status: vigente
  verified: false
  params:
    cases:
      # a) nuevo contrato del mismo arrendador, zona tensionada, renta rebajada más de un 5 %
      - condition: zona-tensionada-rebaja-renta
        reduction: 0.90
        when: {contract: nuevo-contrato, rent_change: rebaja-mas-5, stressed_zone: true}
      # b) 1.º primer alquiler en zona tensionada con arrendatario de 18 a 35 años
      - condition: primer-alquiler-zona-tensionada-joven
        reduction: 0.70
        when: {contract: primer-alquiler, stressed_zone: true, young_tenant: true}
      # b) 2.º arrendatario Administración o entidad sin fines lucrativos, o programa con renta limitada
      - condition: administracion-o-renta-limitada
        reduction: 0.70
        when: {public_or_social_tenant: true}
      # c) rehabilitación terminada en los dos años anteriores al contrato
      - condition: rehabilitacion-reciente
        reduction: 0.60
        when: {recent_rehabilitation: true}
      # d) «en cualquier otro caso»
      - condition: general
        reduction: 0.50
  source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2023-12203#df-2
  notes: "Ley 35/2006, art. 23.2, redacción de la Ley 12/2023, disp. final 2.1. Requisitos al celebrar el contrato; la reducción se aplica mientras se cumplan."

# Art. 23.2 en la redacción del Real Decreto-ley 29/2026 (art. 6.2.2), en vigor el 8 de octubre
# de 2026 y PENDIENTE DE CONVALIDACIÓN. Según la disp. transitoria 38.ª, se aplica a los contratos
# celebrados desde el 1 de diciembre de 2026. Solo entra en escenarios hasta que se convalide.
# Los supuestos a) y b) y la prórroga tácita exigen que el arrendador NO sea gran tenedor
# (art. 3.k de la Ley 12/2023). Si se cumplen varios, se aplica la reducción mayor.
- id: irpf-reduccion-alquiler-rdl-29-2026
  kind: reduccion_irpf_alquiler
  territory: ES
  effective_from: 2026-12-01
  effective_to: null
  status: pendiente_convalidacion
  verified: false
  params:
    cases:
      # a) nuevo contrato del mismo arrendador; 1.º renta inicial rebajada más de un 5 %
      - condition: nuevo-contrato-rebaja-renta-prorroga-mismo-arrendatario  # a´)
        reduction: 1.00
        when: {contract: nuevo-contrato, rent_change: rebaja-mas-5, same_tenant_after_term: true, large_holder: false}
      - condition: nuevo-contrato-rebaja-renta-bajo-indice  # a´) otro arrendatario
        reduction: 1.00
        when: {contract: nuevo-contrato, rent_change: rebaja-mas-5, below_reference_index: true, large_holder: false}
      - condition: nuevo-contrato-rebaja-renta-zona-tensionada-joven  # b´)
        reduction: 0.95
        when: {contract: nuevo-contrato, rent_change: rebaja-mas-5, stressed_zone: true, young_tenant: true, large_holder: false}
      - condition: nuevo-contrato-rebaja-renta-zona-tensionada  # c´)
        reduction: 0.90
        when: {contract: nuevo-contrato, rent_change: rebaja-mas-5, stressed_zone: true, large_holder: false}
      - condition: nuevo-contrato-rebaja-renta-joven  # d´)
        reduction: 0.85
        when: {contract: nuevo-contrato, rent_change: rebaja-mas-5, young_tenant: true, large_holder: false}
      - condition: nuevo-contrato-rebaja-renta  # e´) restantes casos
        reduction: 0.70
        when: {contract: nuevo-contrato, rent_change: rebaja-mas-5, large_holder: false}
      # a) 2.º renta inicial no superior a la última renta
      - condition: nuevo-contrato-renta-no-superior
        reduction: 0.50
        when: {contract: nuevo-contrato, rent_change: no-superior, large_holder: false}
      # a) 3.º renta inicial incrementada respecto de la última renta
      - condition: nuevo-contrato-subida-hasta-5
        reduction: 0.40
        when: {contract: nuevo-contrato, rent_change: subida-hasta-5, large_holder: false}
      - condition: nuevo-contrato-subida-5-a-10
        reduction: 0.30
        when: {contract: nuevo-contrato, rent_change: subida-5-a-10, large_holder: false}
      - condition: nuevo-contrato-subida-10-a-15
        reduction: 0.25
        when: {contract: nuevo-contrato, rent_change: subida-10-a-15, large_holder: false}
      - condition: nuevo-contrato-subida-15-a-20
        reduction: 0.20
        when: {contract: nuevo-contrato, rent_change: subida-15-a-20, large_holder: false}
      - condition: nuevo-contrato-subida-mas-de-20
        reduction: 0.15
        when: {contract: nuevo-contrato, rent_change: subida-mas-de-20, large_holder: false}
      # b) primer alquiler de la vivienda
      - condition: primer-alquiler-bajo-indice  # 1.º
        reduction: 1.00
        when: {contract: primer-alquiler, below_reference_index: true, large_holder: false}
      - condition: primer-alquiler-zona-tensionada-joven  # 2.º
        reduction: 0.95
        when: {contract: primer-alquiler, stressed_zone: true, young_tenant: true, large_holder: false}
      - condition: primer-alquiler-zona-tensionada  # 3.º
        reduction: 0.90
        when: {contract: primer-alquiler, stressed_zone: true, large_holder: false}
      - condition: primer-alquiler-joven  # 4.º
        reduction: 0.85
        when: {contract: primer-alquiler, young_tenant: true, large_holder: false}
      - condition: primer-alquiler-sobre-indice  # 5.º
        reduction: 0.50
        when: {contract: primer-alquiler, below_reference_index: false, large_holder: false}
      # c) Administración o entidad sin fines lucrativos, o programa público con renta limitada
      - condition: administracion-o-renta-limitada
        reduction: 0.70
        when: {public_or_social_tenant: true}
      # d) rehabilitación terminada en los dos años anteriores al contrato
      - condition: rehabilitacion-reciente
        reduction: 0.60
        when: {recent_rehabilitation: true}
      # prórroga tácita con renta que no excede el índice de referencia
      - condition: prorroga-tacita-bajo-indice
        reduction: 0.80
        when: {contract: prorroga-tacita, below_reference_index: true, large_holder: false}
  source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2026-20823#a6
  notes: "Ley 35/2006, art. 23.2, redacción del RDL 29/2026 (BOE-A-2026-20823). Índice = sistema de índices de precios de referencia (DA 2.ª del RDL 7/2019)."

# Amortización del inmueble: 3 % sobre el mayor entre el coste de adquisición satisfecho y el
# valor catastral, sin incluir el suelo. Sin valor del suelo conocido, se prorratea el coste
# entre los valores catastrales del suelo y de la construcción (Reglamento, art. 14.2.a).
- id: irpf-amortizacion-inmueble
  kind: amortizacion_inmueble_alquiler
  territory: ES
  effective_from: 2007-01-01
  effective_to: null
  status: vigente
  verified: false
  params: {rate: 0.03}
  source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2006-20764#a23
  notes: "Ley 35/2006, art. 23.1.b; Real Decreto 439/2007, art. 14.2.a (https://www.boe.es/buscar/act.php?id=BOE-A-2007-6820#a14)."

# --- Tanda 2 (ADR-0007): cuota incremental del IRPF ---------------------------------
# Las reglas de escalas y mínimos se resuelven por PERIODO IMPOSITIVO (año natural).

# Escala estatal de la base liquidable general (art. 63.1.1.º), redacción de la Ley 11/2020,
# con efectos desde el 1 de enero de 2021. Cada tipo se aplica a la parte de la base desde `from`.
- id: irpf-escala-general-estatal-2021
  kind: escala_irpf_general_estatal
  territory: ES
  effective_from: 2021-01-01
  effective_to: null
  status: vigente
  verified: false
  params:
    brackets:
      - {from: 0, rate: 0.095}
      - {from: 12450, rate: 0.12}
      - {from: 20200, rate: 0.15}
      - {from: 35200, rate: 0.185}
      - {from: 60000, rate: 0.225}
      - {from: 300000, rate: 0.245}
  source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2006-20764#a63
  notes: "Ley 35/2006, art. 63.1. La cuota es la escala sobre la base menos la escala sobre el mínimo personal y familiar (63.1.2.º)."

# Mínimo del contribuyente (art. 57), redacción de la Ley 26/2014, en vigor el 1 de enero de 2015.
- id: irpf-minimo-contribuyente-2015
  kind: minimo_contribuyente
  territory: ES
  effective_from: 2015-01-01
  effective_to: null
  status: vigente
  verified: false
  params: {general: 5550, over_65_extra: 1150, over_75_extra: 1400}
  source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2006-20764#a57
  notes: "Ley 35/2006, art. 57. Aumento de 1.150 € con más de 65 años y 1.400 € adicionales con más de 75."

# Mínimo por descendientes (art. 58), redacción de la Ley 26/2014, en vigor el 1 de enero de 2015.
# Por descendiente menor de 25 años (o con discapacidad) que conviva y no tenga rentas > 8.000 €.
- id: irpf-minimo-descendientes-2015
  kind: minimo_descendientes
  territory: ES
  effective_from: 2015-01-01
  effective_to: null
  status: vigente
  verified: false
  params: {first: 2400, second: 2700, third: 4000, fourth_and_more: 4500, under_3_extra: 2800}
  source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2006-20764#a58
  notes: "Ley 35/2006, art. 58. Requisitos del descendiente en el apartado 1; aumento por menor de tres años en el apartado 2."

# Límite de intereses y gastos de reparación y conservación (art. 23.1.a.1.º): no pueden superar los
# rendimientos íntegros de cada inmueble; el exceso se deduce en los cuatro años siguientes.
- id: irpf-limite-intereses-reparacion
  kind: limite_intereses_reparacion
  territory: ES
  effective_from: 2007-01-01
  effective_to: null
  status: vigente
  verified: false
  params: {carryforward_years: 4}
  source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2006-20764#a23
  notes: "Ley 35/2006, art. 23.1.a.1.º (texto original; las modificaciones del art. 23 afectan a los apartados 2 y 3)."
