# Comunidad Autónoma de La Rioja (ES-17) y municipio de Logroño (ES-17-26089). Ver README.md.
# SIN VERIFICAR: ninguna pasa a verified: true hasta que Rodrigo lea la fuente.
# Texto consolidado de la Ley 10/2017 leído el 2026-11-03 (BOE-A-2017-13750, «Última actualización
# publicada el 29/10/2026»). Entró en vigor el 31/10/2017.
#
# PENDIENTE (sin fuente oficial leída, no se escribe):
# - Mínimos personales y familiares propios (minimo_contribuyente, minimo_descendientes): La Rioja
#   solo modifica el mínimo por discapacidad de descendientes (art. 31 bis); no hay mínimo del
#   contribuyente ni de descendientes completos que sustituyan a los estatales. No se escriben.
# - Deflactación de la escala (art. 31 ter): condicionada a un proyecto de ley futuro; el texto
#   consolidado a 29/10/2026 mantiene la escala del art. 31 sin cambios.
# - Régimen urbanístico municipal de Logroño del alquiler turístico (la prensa habla de licencia previa
#   y moratoria desde noviembre de 2025; sin texto oficial leído).
# - Decreto 15/2021 (modifica el Decreto 10/2017): no se ha leído su articulado; por la información
#   oficial no toca las viviendas de uso turístico.
# - Ninguna fecha de inicio anterior a 2017-10-31 (consolidación) se ha comprobado.

# ITP de inmuebles, tipo general (único, para todo el valor, no por tramos). Los tipos reducidos del
# art. 45 (vivienda habitual) y 47 (explotaciones agrarias) no aplican a un inversor particular.
- id: la-rioja-itp-inmuebles-2017
  kind: impuesto_compra_segunda_mano
  territory: ES-17
  effective_from: 2017-10-31
  effective_to: null
  status: vigente
  verified: false
  params: {rate: 0.07}
  source_url: https://www.boe.es/eli/es-ri/l/2017/10/27/10/con
  notes: "Ley 10/2017, de 27 de octubre, de La Rioja (BOE-A-2017-13750), art. 44.1: tipo del 7 % en las transmisiones de bienes inmuebles y en la constitución y cesión de derechos reales sobre ellos, salvo los de garantía. Tipo único sobre toda la base liquidable, sin tramos. Fecha de inicio = entrada en vigor de la ley consolidadora (31/10/2017); el 7 % puede venir de normas anteriores que la ley consolida (por verificar)."

# AJD de la escritura de compra de vivienda sujeta a IVA: tipo general de los documentos notariales,
# 1 % sobre todo el valor (único). Sin bandas ni salto de banda.
- id: la-rioja-ajd-compra-vivienda-2017
  kind: ajd_compra_vivienda
  territory: ES-17
  effective_from: 2017-10-31
  effective_to: null
  status: vigente
  verified: false
  params:
    bands:
      - {up_to: null, rate: 0.01}
    cap_jumps: false
  source_url: https://www.boe.es/eli/es-ri/l/2017/10/27/10/con
  notes: "Ley 10/2017 de La Rioja, art. 48: las primeras copias de escrituras con cantidad o cosa valuable, inscribibles y no sujetas a Sucesiones y Donaciones ni a los números 1 y 2 del art. 1 del TRLITPAJD, tributan además de la cuota fija al 1 %. No incluye el 0,1 % de vivienda habitual de determinados sujetos pasivos (art. 49) ni el 1,5 % cuando se renuncia a la exención del IVA (art. 52, no aplica a vivienda nueva con IVA). Persona jurídica: mismo tipo (no hay tipo propio). Fecha de inicio como en el ITP (por verificar)."

