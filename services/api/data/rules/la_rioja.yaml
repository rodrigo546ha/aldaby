# --- Alquiler ---------------------------------------------------------------------------------

# Ninguna zona tensionada en La Rioja: ni «Rioja» ni «Logroño» figuran en ninguna de las nueve
# resoluciones trimestrales del Ministerio leídas, desde la del primer trimestre de 2024 hasta la del
# segundo de 2026: BOE-A-2024-5214, BOE-A-2024-20576, BOE-A-2025-1721, BOE-A-2025-8636,
# BOE-A-2025-15728, BOE-A-2025-21901, BOE-A-2026-2448, BOE-A-2026-9175 y BOE-A-2026-16532.
# No se ha leído la del segundo trimestre de 2024 ni se ha encontrado aún la del tercero de 2026.
# Revisar con cada resolución nueva y actualizar checked_through.
- id: la-rioja-zonas-tensionadas
  kind: zona_tensionada
  territory: ES-17
  effective_from: 2023-05-26
  effective_to: null
  status: vigente
  verified: false
  params: {declared: false, checked_through: 2026-07-29}
  source_url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-16532
  notes: "Ley 12/2023, art. 18: la declaración corresponde a la comunidad autónoma; el Ministerio publica la relación cada trimestre."

# Vivienda de uso turístico en La Rioja: Decreto 10/2017 (Reglamento General de Turismo, BOR núm. 34,
# 22/03/2017), arts. 66, 67 y 69 en la redacción del Decreto 40/2018, de 23 de noviembre (BOR núm. 141,
# 30/11/2018; entra en vigor el día siguiente: 01/12/2018).
- id: la-rioja-alquiler-turistico
  kind: regimen_alquiler_turistico
  territory: ES-17
  effective_from: 2018-12-01
  effective_to: null
  status: vigente
  verified: false
  params:
    regime: "Vivienda de uso turístico en La Rioja (Decreto 10/2017): comunicación de inicio de actividad a la Dirección General de Turismo e inscripción en el Registro de Proveedores de Servicios Turísticos; sin licencia autonómica"
    requirements:
      - code: comunicacion-inicio
        description: "Comunicación de inicio de actividad (modelo oficial) ante la Dirección General de Turismo; permite ejercer la actividad desde su presentación (trámite oficial; requisitos de los arts. 66 a 71 del Decreto 10/2017)"
        source_url: https://web.larioja.org/oficina-electronica/tramite?n=24269
      - code: vivienda-completa
        description: "Cesión temporal de la vivienda completa, amueblada y equipada para uso inmediato; la cesión por habitaciones se somete al régimen de las pensiones (art. 66.1 y 66.3)"
        source_url: https://ias1.larioja.org/boletin/Bor_Boletin_visor_Servlet?referencia=8916193-1-PDF-520959-X
      - code: umbral-tres-meses
        description: "No es vivienda de uso turístico la alquilada en un único periodo consecutivo igual o inferior a tres meses al año (art. 66.2)"
        source_url: https://ias1.larioja.org/boletin/Bor_Boletin_visor_Servlet?referencia=8916193-1-PDF-520959-X
      - code: superficie-y-capacidad
        description: "Superficie útil mínima del Decreto 28/2013 de habitabilidad (art. 66.5); capacidad máxima de plazas igual al doble de las habitaciones, incluido el salón, y hasta 8 plazas (art. 66.6)"
        source_url: https://ias1.larioja.org/boletin/Bor_Boletin_visor_Servlet?referencia=8916193-1-PDF-520959-X
      - code: estatutos-y-normativa-municipal
        description: "No puede destinarse a uso turístico si lo prohíben los estatutos de la comunidad de propietarios o incumple la normativa municipal aplicable; en comunidad de propietarios no pueden ofertarse servicios que causen molestias ni destinarse a fiestas o eventos (art. 67)"
        source_url: https://ias1.larioja.org/boletin/Bor_Boletin_visor_Servlet?referencia=8916193-1-PDF-520959-X
      - code: numero-de-registro-y-placa
        description: "El número de inscripción en el registro de proveedores de servicios turísticos debe constar en la comercialización y publicidad, y es obligatoria la placa identificativa en lugar visible de la entrada (art. 69.3 y 69.4)"
        source_url: https://ias1.larioja.org/boletin/Bor_Boletin_visor_Servlet?referencia=8916193-1-PDF-520959-X
  source_url: https://ias1.larioja.org/boletin/Bor_Boletin_visor_Servlet?referencia=8916193-1-PDF-520959-X
  notes: "Redacción del Decreto 10/2017 según el Decreto 40/2018 (BOR núm. 141, 30/11/2018; disposición final: en vigor el día siguiente). No se ha leído el Decreto 15/2021 (BOR 2021, en vigor 20/02/2021), que también modifica el Decreto 10/2017; no consta que toque estos artículos. Pendiente comprobar el texto consolidado vigente y la ordenanza o plan municipal de Logroño."

