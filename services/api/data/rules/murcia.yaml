# Ninguna zona tensionada en la Región de Murcia: ni «Murcia» ni «Cartagena» figuran en ninguna de las
# nueve resoluciones trimestrales del Ministerio leídas (texto completo en el BOE), desde la del primer
# trimestre de 2024 hasta la del segundo de 2026: BOE-A-2024-5214, BOE-A-2024-20576, BOE-A-2025-1721,
# BOE-A-2025-8636, BOE-A-2025-15728, BOE-A-2025-21901, BOE-A-2026-2448, BOE-A-2026-9175 y
# BOE-A-2026-16532. No se ha leído la del segundo trimestre de 2024. No consta la del tercer trimestre
# de 2026. Revisar con cada resolución nueva y actualizar checked_through.
- id: murcia-zonas-tensionadas
  kind: zona_tensionada
  territory: ES-14
  effective_from: 2023-05-26
  effective_to: null
  status: vigente
  verified: false
  params: {declared: false, checked_through: 2026-07-29}
  source_url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-16532
  notes: "Ley 12/2023, art. 18: la declaración corresponde a la comunidad autónoma; el Ministerio publica la relación cada trimestre."

# Vivienda de uso turístico en la Región de Murcia: Decreto 256/2019, de 10 de octubre (BORM núm. 242,
# 19/10/2019); entra en vigor a los veinte días de su completa publicación (disposición final primera): 08/11/2019.
- id: murcia-alquiler-turistico
  kind: regimen_alquiler_turistico
  territory: ES-14
  effective_from: 2019-11-08
  effective_to: null
  status: vigente
  verified: false
  params:
    regime: "Vivienda de uso turístico en la Región de Murcia (Decreto 256/2019): declaración responsable ante el Instituto de Turismo de la Región de Murcia antes de prestar el servicio"
    requirements:
      - code: declaracion-responsable
        description: "Declaración responsable de clasificación turística, según modelo normalizado, ante el Instituto de Turismo de la Región de Murcia con carácter previo a prestar el servicio; permite ejercer la actividad e inscribirse en el Registro de Empresas y Actividades Turísticas (art. 28); no se puede comercializar sin haberla presentado (art. 6.1)"
        source_url: https://www.borm.es/services/anuncio/780550/pdf
      - code: disponibilidad-inmueble
        description: "Manifestar la disponibilidad del inmueble para destinarlo a alojamiento turístico; con referencia catastral y capacidad de cada vivienda (art. 28.1.b y d); una empresa gestora que no sea titular debe tener la disponibilidad del inmueble (art. 5.7)"
        source_url: https://www.borm.es/services/anuncio/780550/pdf
      - code: seguro-responsabilidad-civil
        description: "Seguro de responsabilidad civil en vigor durante toda la actividad, con cobertura mínima de 300.000 euros por siniestro (art. 8)"
        source_url: https://www.borm.es/services/anuncio/780550/pdf
      - code: responsable-alojamiento
        description: "Designar un responsable del alojamiento y anunciar su teléfono en el interior de cada vivienda, al menos en español e inglés (art. 9)"
        source_url: https://www.borm.es/services/anuncio/780550/pdf
      - code: capacidad-maxima
        description: "Capacidad máxima de 10 plazas, la fijada en la licencia de ocupación o equivalente, con superficies mínimas por dormitorio (6 m² individual, 8 m² doble) (art. 14)"
        source_url: https://www.borm.es/services/anuncio/780550/pdf
      - code: un-titular-por-vivienda
        description: "Un único titular de la explotación por vivienda a efectos de inscripción en el Registro de Empresas y Actividades Turísticas (art. 5.5); cedida en su totalidad, sin coincidencia de usuarios con contratos distintos (art. 5.1)"
        source_url: https://www.borm.es/services/anuncio/780550/pdf
  source_url: https://www.borm.es/services/anuncio/780550/pdf
  notes: "Decreto 256/2019 de la Región de Murcia (BORM núm. 242, 19/10/2019). Fecha de inicio calculada: veinte días tras la publicación. Si se cede por habitaciones, el titular debe ser persona física empadronada y residente en la vivienda (art. 5.2). Excluida la cesión sometida a la LAU (art. 1.2.b). Pendiente comprobar posibles modificaciones posteriores a 2019 y los requisitos urbanísticos municipales y de estatutos de la comunidad."

# --- Plusvalía municipal (tipo único) ----------------------------------------------------------

# Murcia: art. 9 de la ordenanza reguladora del IIVTNU, texto de 2026 publicado por el Ayuntamiento
# (última modificación: Pleno de 26/12/2024, BORM de 28/12/2024, efectos 01/01/2025).
- id: murcia-plusvalia-tipo
  kind: tipo_plusvalia
  territory: ES-14-30030
  effective_from: 2025-01-01
  effective_to: null
  status: vigente
  verified: false
  params: {rate: 0.30}
  source_url: https://amt.murcia.es/sites/amt/files/2026-01/3.5%20Impuesto-Plusval%C3%ADa-2026.pdf
  notes: "Ordenanza reguladora del IIVTNU del Ayuntamiento de Murcia, art. 9: «el tipo impositivo del TREINTA por ciento». Texto vigente en 2026 (modificada por el Pleno de 26/12/2024, BORM de 28/12/2024, efectos 01/01/2025). Fecha de inicio = esa modificación; el 30 % puede venir de antes (por verificar). No se ha leído el BORM."

