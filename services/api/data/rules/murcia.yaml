# vigor el día de su publicación; antes era el 29,70 %. Se mantiene en los textos de 2023 a 2026.
- id: cartagena-plusvalia-tipo
  kind: tipo_plusvalia
  territory: ES-14-30016
  effective_from: 2022-05-30
  effective_to: null
  status: vigente
  verified: false
  params: {rate: 0.30}
  source_url: https://www.cartagena.es/gestion/documentos/acuerdosynormativas/92684.pdf
  notes: "Ordenanza reguladora del IIVTNU del Ayuntamiento de Cartagena, art. 9.1: «El tipo de gravamen de este impuesto es del 30 por 100». Redacción del edicto del BORM núm. 123, 30/05/2022 (https://www.borm.es/services/anuncio/ano/2022/numero/2764/pdf?id=806518), en vigor el día de su publicación; confirmado en el texto de las ordenanzas de Cartagena para 2026 (entrada en vigor 01/01/2026, texto revisado a 27/01/2026). Los edictos de 2024 y 2025 (BORM 11/12/2024 y 03/11/2025) solo cambian coeficientes."
