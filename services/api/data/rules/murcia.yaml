# Región de Murcia (ES-14) y municipios de Murcia (ES-14-30030) y Cartagena (ES-14-30016).
# Ver README.md. SIN VERIFICAR: ninguna pasa a verified: true hasta que Rodrigo lea la fuente.
# Texto consolidado del Decreto Legislativo 1/2010 leído el 2026-11-03 en el BOE
# («Última actualización publicada el 24/07/2025»); la comparación de versiones se hizo en las
# redacciones históricas que ofrece el propio BOE. Códigos INE comprobados en el diccionario de
# municipios del INE (2026): Murcia 30030, Cartagena 30016.
#
# PENDIENTE (sin fuente oficial leída, no se escribe):
# - Mínimos del contribuyente y por descendientes: Murcia NO tiene mínimos propios (el DL 1/2010 no
#   los regula), se aplican los estatales; por eso no hay reglas minimo_contribuyente ni minimo_descendientes.
# - Cualquier modificación autonómica posterior al 24/07/2025 que el BOE aún no consolide (no consta
#   Ley de Presupuestos de 2026 de la Región de Murcia; comprobar en el BORM antes de verificar).
# - Régimen urbanístico municipal del alquiler turístico de Murcia y Cartagena.
# - Fecha de inicio del 30 % de la plusvalía de Murcia (solo se ha leído el texto vigente en 2026).

# ITP de inmuebles, tipo general (único, para todo el valor). Los tipos reducidos del art. 6 (apartados
# 2 a 9: VPO de régimen especial, empresas inmobiliarias, familia numerosa, menores de 40 años,
# discapacidad, etc.) no aplican a un inversor particular.
# Tipo anterior: 8 % desde el 11/07/2013 (Ley 6/2013, art. 1.4), cerrado cuando entra en vigor la
# Ley 3/2025 (BORM 24/07/2025; en vigor el día siguiente).
- id: murcia-itp-inmuebles-2013
  kind: impuesto_compra_segunda_mano
  territory: ES-14
  effective_from: 2013-07-11
  effective_to: 2025-07-25
  status: vigente
  verified: false
  params: {rate: 0.08}
  source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2011-10542#a6
  notes: "Decreto Legislativo 1/2010 de la Región de Murcia, art. 6.1, redacción de la Ley 6/2013 (publicada el 10/07/2013, en vigor el 11/07/2013): tipo del 8 % para la transmisión de bienes inmuebles, único para todo el valor (no por tramos). Leído en la versión histórica del BOE."

- id: murcia-itp-inmuebles-2025
  kind: impuesto_compra_segunda_mano
  territory: ES-14
  effective_from: 2025-07-25
  effective_to: null
  status: vigente
  verified: false
  params: {rate: 0.0775}
  source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2025-16147
  notes: "Decreto Legislativo 1/2010 de la Región de Murcia, art. 6.1, redacción del art. 55.Catorce de la Ley 3/2025, de 23 de julio, de Presupuestos Generales de la Región de Murcia para 2025 (BOE-A-2025-16147; entra en vigor el día siguiente a su publicación en el BORM, 24/07/2025): «será del 7,75 %», con vigencia indefinida. Tipo único para todo el valor (no por tramos). Texto consolidado: https://www.boe.es/buscar/act.php?id=BOE-A-2011-10542#a6"

# AJD de la escritura de compra de vivienda sujeta a IVA: tipo general de los documentos notariales,
# 1,5 % sobre todo el valor (único). Sin bandas ni salto de banda. Sin tipo propio para persona jurídica.
# El tipo es el del texto original (en vigor el 01/02/2011); el apartado 1 del art. 7 no ha cambiado de tipo.
- id: murcia-ajd-compra-vivienda-2011
  kind: ajd_compra_vivienda
  territory: ES-14
  effective_from: 2011-02-01
  effective_to: null
  status: vigente
  verified: false
  params:
    bands:
      - {up_to: null, rate: 0.015}
    cap_jumps: false
  source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2011-10542#a7
  notes: "Decreto Legislativo 1/2010 de la Región de Murcia, art. 7.1: primeras copias de escrituras y actas notariales inscribibles, con cantidad o cosa valuable y no sujetas a Sucesiones y Donaciones ni a TPO/IVA del art. 1.1 y 1.2 del TRLITPAJD, tributan además de la cuota fija «al tipo de gravamen del 1,5 %», salvo los tipos de los apartados 2 a 9 (0,1 %, 0,5 %, 1,5 % y 2,5 % para supuestos concretos: jóvenes, familia numerosa, discapacidad, etc.), que no se incluyen. Persona jurídica: mismo tipo."

