  notes: "Texto refundido de la Ley Foral del IRPF (Decreto Foral Legislativo 4/2008), art. 58: «La cuota íntegra del impuesto se obtendrá por la suma de las cuotas resultantes de la aplicación de lo dispuesto en los artículos 59 y 60»: una escala foral, sin parte estatal ni autonómica. Fecha de inicio: aproximada a la del texto refundido; el régimen foral es anterior."

