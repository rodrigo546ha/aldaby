# Comunidad Foral de Navarra (ES-15) y Pamplona/Iruña (ES-15-31201). Régimen foral (ADR-0046).
# Ver README.md. SIN VERIFICAR: ninguna pasa a verified: true hasta que Rodrigo lea la fuente.
# Fuentes leídas el 2026-11-03: texto consolidado del IRPF (DFLeg 4/2008) y su Reglamento (DF 174/1999),
# del ITP y AJD (DFLeg 129/1999) y de la Ley Foral 2/1995 de Haciendas Locales, en lexnavarra; Leyes
# Forales 22/2023 (BOE-A-2024-1694) y 17/2025 (BOE-A-2026-3910); Orden Foral 157E/2025 (BON 118,
# 13/06/2025); ordenanzas fiscales 1 y 4 de Pamplona para 2026.
#
# PENDIENTE (sin fuente oficial leída o sin modelar):
# - La escala general del art. 59 sale del BOE (Ley Foral 22/2023): en lexnavarra es una imagen alojada
#   en otro dominio, que no se descargó. No se ha podido descartar una ley foral de 2026 que cambie el IRPF.
# - Desde cuándo rige el 28 % del último tramo de la escala del ahorro.
# - Mínimo personal: si los incrementos por edad (264 € desde 65, 585 € desde 75) se suman o el segundo
#   sustituye al primero. Se modela que sustituye («el incremento será de»): confirmar.
# - Incremento del 40 % de la deducción por descendientes con rentas bajas (art. 62.9.b.b'.2.º): no se
#   modela (la cuota sale algo mayor para rentas de hasta 30.000 €).
# - Reducción del 50 % del alquiler en zona tensionada: exige además el contrato inscrito en el Registro de
#   Contratos de Arrendamiento de Vivienda de Navarra; el plan lo supone hecho. Las reducciones del 70 % y
#   90 % por intermediación de la sociedad pública no se modelan.
# - Si la base de la amortización del 3 % incluye los gastos y tributos de la compra.
# - Coeficientes máximos de la plusvalía actualizados para 2026 (la ley dice que se actualizan cada año).
# - Fecha de publicación en el BON de las ordenanzas fiscales de Pamplona para 2026.
# - Alquiler turístico: consolidación del Decreto Foral 230/2011 y si una norma posterior sustituye a la
#   Ley Foral 7/2003; régimen urbanístico de Pamplona (art. 28 del Plan Municipal), solo visto en prensa.

# --- IRPF foral ---------------------------------------------------------------------------------------------

- id: navarra-regimen-irpf
  kind: regimen_irpf
