- id: navarra-irpf-deducciones-2026
  kind: deducciones_cuota_irpf_foral
  territory: ES-15
  effective_from: 2026-01-01
  effective_to: null
  status: vigente
  verified: false
  params:
    general: 1084
    general_by_income:
      - {base: 17500, amount: 1280}
      - {base: 30000, amount: 150}
      - {base: 32000, amount: 0}
    age:
      - {min_age: 65, amount: 264}
      - {min_age: 75, amount: 585}
    descendants: [483, 512, 732, 981, 1111, 1286]
    young_children:
      - {under_age: 3, amount: 644}
  source_url: https://www.lexnavarra.navarra.es/detalle.asp?r=29657
  notes: "DFLeg 4/2008, art. 62.9 (deducciones personales y familiares en la cuota; la cuota líquida no puede ser negativa, art. 61). a) «La deducción por mínimo personal será con carácter general de 1.084 euros anuales»; más 264 € con 65 años o más y 585 € con 75 o más (se modela que el segundo sustituye al primero: pendiente); más 1.280 € con rentas de hasta 17.500 €, 1.280 − 0,0904 × (rentas − 17.500) hasta 30.000 € y 150 − 0,075 × (rentas − 30.000) hasta 32.000 € (letras c', d' y e', Ley Foral 17/2025, art. «Catorce», efectos 01/01/2026). b) Descendientes: 483, 512, 732, 981, 1.111 y 1.286 € (1.º a 6.º y siguientes), más 644 € por menor de 3 años. Las rentas del art. 64.5 se aproximan con la base liquidable general. Sin modelar: discapacidad, ascendientes y el incremento del 40 % por descendiente con rentas bajas."

- id: navarra-rendimiento-alquiler
  kind: rendimiento_alquiler_irpf
  territory: ES-15
  effective_from: 2025-01-01
  effective_to: null
  status: vigente
  verified: false
  params:
    housing: {base: general, expenses: todos, cap: todos, carryforward_years: 4}
    other: {base: general, expenses: todos, cap: todos, carryforward_years: 4}
  source_url: https://www.lexnavarra.navarra.es/detalle.asp?r=29657
  notes: "DFLeg 4/2008: el rendimiento del capital inmobiliario va a la parte general (art. 53.a; no está en el art. 54). Art. 25.1: «El importe total a deducir no podrá exceder, para cada bien o derecho, de la cuantía de los respectivos rendimientos íntegros [...] El exceso se podrá deducir en los cuatro años inmediatos y sucesivos»; si concurre con gastos del año, «éstos se aplicarán en primer lugar». Gastos deducibles: Reglamento (DF 174/1999), art. 12.1 (intereses, tributos, servicios, conservación y reparación, seguros, amortización…). Fecha de inicio: la de la redacción vigente del art. 25 (Ley Foral 17/2025, efectos 01/01/2025)."

- id: navarra-reduccion-alquiler
  kind: reduccion_irpf_alquiler
  territory: ES-15
  effective_from: 2025-01-01
  effective_to: null
  status: vigente
  verified: false
  params:
    cases:
      - condition: zona-tensionada-vivienda-permanente
        reduction: 0.50
        when: {stressed_zone: true}
  source_url: https://www.lexnavarra.navarra.es/detalle.asp?r=29657
  notes: "DFLeg 4/2008, art. 25.2.b) (Ley Foral 20/2024; requisito de registro por la Ley Foral 17/2025, art. «Siete», efectos 01/01/2025): «Un 50 por ciento, cuando la vivienda esté situada en una zona de mercado residencial tensionado y el rendimiento proceda del arrendamiento con destino a vivienda permanente [...] excluyéndose [...] los arrendamientos por habitaciones», con el contrato inscrito en el Registro de Contratos de Arrendamiento de Vivienda de Navarra a la fecha de devengo (el plan lo supone hecho). Fuera de zona tensionada y sin intermediación pública no hay reducción. No se modelan el 70 % y el 90 % de la intermediación por la sociedad pública (25.2.a)."

- id: navarra-amortizacion-inmueble
  kind: amortizacion_inmueble_alquiler
  territory: ES-15
  effective_from: 2008-07-01
  effective_to: null
  status: vigente
  verified: false
  params: {rate: 0.03}
  source_url: https://www.lexnavarra.navarra.es/detalle.asp?r=10615
  notes: "Reglamento del IRPF de Navarra (DF 174/1999), art. 13.1.a): amortización «cuando, en cada año, no exceda del resultado de aplicar el 3 por 100 sobre el coste de adquisición o mejora satisfecho, sin incluir en el cómputo el del suelo» (25 % del coste si no se conoce el valor del suelo). En la venta se resta la amortización mínima aunque no se dedujera (art. 39.1). Fecha de inicio aproximada; si la base incluye los gastos de compra, pendiente."

