  params:
    regime: "Vivienda para uso turístico en Euskadi (Decreto 101/2018, modificado por el Decreto 52/2025): declaración responsable e inscripción en el Registro de Empresas y Actividades Turísticas de Euskadi"
    requirements:
      - code: declaracion-responsable
