# País Vasco (ES-16): Álava (ES-16-01), Gipuzkoa (ES-16-20) y Bizkaia (ES-16-48). Régimen foral: cada
# territorio histórico tiene su IRPF, su ITP y AJD y sus normas de haciendas locales (ADR-0046).
# Ver README.md. SIN VERIFICAR: ninguna pasa a verified: true hasta que Rodrigo lea la fuente.
# Fuentes leídas el 2026-11-03: Bizkaia (NF 13/2013 del IRPF consolidada a 01/01/2026 y a 18/09/2025,
# NF 2/2025, NF 7/2025, NF 1/2011 del ITP y AJD, NF 11/2013 del IS, NF 8/1989 de plusvalía); Álava (NF
# 33/2013 del IRPF consolidada, NF 3/2025, NF 19/2024, NF 21/2025, NF 26/2023, Reglamento del IRPF, NF
# 11/2003 del ITP y AJD, ordenanzas de Vitoria-Gasteiz 2026); BOPV y BOE (zonas tensionadas, turismo).
#
# PENDIENTE (sin fuente oficial leída o sin modelar):
# - GIPUZKOA: el robots.txt de gipuzkoa.eus bloquea a los agentes de Anthropic, y ahí están el BOG y sus
#   normas forales. Sin leer: escalas y deducciones del IRPF, régimen del alquiler aprobado (solo el
#   proyecto, en Zergak), ganancia, ITP y AJD. Un residente o un inmueble de Gipuzkoa no tienen plan hasta
#   que Rodrigo lea la NF 3/2014 y sus reformas: el error dice qué regla falta.
# - BILBAO: bilbao.eus prohíbe todo acceso automático; sin IBI ni plusvalía (el IBI se puede dar del recibo).
# - Donostia: tipo del IBI (el anexo no se localizó).
# - Amortización mínima en la ganancia de una vivienda alquilada (art. 32.2), en la que no se deduce
#   amortización: se modela el 2 % anual (período máximo de 50 años del IS) de forma PROVISIONAL.
# - Coeficientes de actualización del valor de adquisición en la ganancia (decreto foral de cada año):
#   no se modelan; sin ellos la ganancia sale mayor (prudente).
# - Bonificación del 70 %: no hay definición oficial de los índices de referencia de Euskadi.
# - Bonificación del 35 % en núcleos rurales de Álava (DA 34.ª) y minoración de 200 € en núcleos de menos
#   de 500 habitantes: no se modelan.
# - Las deducciones familiares se restan de toda la cuota (general y del ahorro) y la minoración solo de la
#   general; el motor las resta todas de la general: para bases generales muy bajas, la cuota sale mayor.
# - Seguro de impago (hasta 300 € deducibles): no se modela.
# - Sopela y Urduliz (BOPV 14/08/2026): solo leído el título de sus órdenes; sin regla hasta leer el Resuelvo.
# - Máximos de los coeficientes de la plusvalía de Álava y Gipuzkoa: sin leer; se usan los estatales como
#   tope de los coeficientes municipales.

