  notes: "Ley 13/2016 de Turismo y Decreto 101/2018 (BOPV 143, 26/07/2018), modificado por el Decreto 52/2025 (BOPV 53, 18/03/2025; en vigor el día siguiente), que suprime la exclusión del medio rural. Se presume actividad habitual con publicidad en canales turísticos o estancias de 31 días o menos dos o más veces al año (art. 2.4). Pendiente el régimen municipal: Bilbao (modificación del Plan General de 2026), Donostia (PGOU de febrero de 2026 que impide nuevas licencias, según el censo municipal) y Vitoria-Gasteiz."
