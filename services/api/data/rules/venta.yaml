# --- IRPF: base del ahorro (ganancia patrimonial) ------------------------------------------

# Ley del IRPF, arts. 66.1 (estatal) y 76 (autonómica), redacción de la Ley 7/2024, con efectos
# desde el 01/01/2025. La escala autonómica del ahorro la fija la ley estatal para todas las
# comunidades de régimen común: por eso va en ES y la heredan.
- id: irpf-escala-ahorro-estatal-2025
  kind: escala_irpf_ahorro_estatal
  territory: ES
  effective_from: 2025-01-01
  effective_to: null
  status: vigente
  verified: false
  params:
    brackets:
      - {from: 0, rate: 0.095}
