[project]
name = "housefinder-api"
version = "0.1.0"
description = "Motores de cálculo, normativa e ingesta de HouseFinder"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.2",
  "cryptography>=43",
  "anthropic[bedrock]>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.9"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["db: necesita PostgreSQL + PostGIS (DATABASE_URL); se salta si no hay base"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
