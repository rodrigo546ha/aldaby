# Plan SINTÉTICO, no de F0: sirve para probar el arnés de la prueba de oro hasta que haya un
# plan manual real. Datos inventados para el test, ninguno de una persona.
#
# Valores esperados calculados a mano, sin el motor, con fórmulas cerradas en coma flotante:
# - cuota francesa: P·r·(1+r)^n / ((1+r)^n − 1), r = tipo / 12, n = años × 12;
# - intereses del primer año: 12 × cuota − (P − saldo tras 12 meses);
# - IRPF incremental: escalas estatal y de Madrid tramo a tramo; con base 25.000 € el
#   rendimiento cae en los tramos del 15 % y del 12,8 % (27,8 % en total).
# Reglas y parámetros: los del repositorio a 2026-10-28 (sin verificar: PROVISIONAL).
